name: Launch Readiness Impact (advisory)
on:
  pull_request:
  issues:
    types: [opened, edited, reopened, labeled]
permissions:
  contents: read
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate traceability contract
        run: node scripts/check-launch-readiness.mjs
      - name: Classify PR file impacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/launch-changed.txt"
          node scripts/check-launch-readiness.mjs --changed-files "$RUNNER_TEMP/launch-changed.txt" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Classify issue / defect against linked requirements
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const m=JSON.parse(readFileSync(".project-master/launch-readiness.json","utf8"));
            const ref="#"+process.env.ISSUE_NUMBER;
            const requirement_ids=m.requirements.filter(r=>r.issue_refs.includes(ref)).map(r=>r.id);
            const labels=JSON.parse(process.env.ISSUE_LABELS||"[]");
            const type=labels.some(l=>l.name==="bug")?"defect":"feature";
            writeFileSync(process.env.RUNNER_TEMP+"/launch-event.json",JSON.stringify([{type,ref,requirement_ids}]));
          '
          node scripts/check-launch-readiness.mjs --events "$RUNNER_TEMP/launch-event.json" --markdown >> "$GITHUB_STEP_SUMMARY"
