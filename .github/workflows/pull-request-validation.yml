name: Pull request validation

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'codex/**'
      - 'agent/**'
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
      - 'governance/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate platform
        run: npm run platform:validate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production client
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  connected-rating:
    name: Connected rating integrity
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connected-rating]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Discover stable Vercel PR preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          preview_url="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100" \
              --jq '.[] | select(.user.login == "vercel[bot]") | .body' |
            grep -oE 'https://[a-z0-9-]+\.vercel\.app' |
            tail -n 1
          )"
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Verify exact Vercel release target
        env:
          RELEASE_BASE_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node scripts/verify-release-target.js && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run non-destructive connected rating acceptance
        env:
          RELEASE_BASE_URL: ${{ steps.preview.outputs.url }}
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
        run: npx playwright test --config=playwright.release.config.js --grep "rating reconciliation dry-run is idempotent and completed aggregates are coherent"
      - name: Retain connected rating evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-rating-${{ github.sha }}
          path: |
            playwright-report/release-check/
            test-results/release-check/
          if-no-files-found: ignore
          retention-days: 30

