name: Pull request validation

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'codex/**'
      - 'agent/**'
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
      - 'governance/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate platform
        run: npm run platform:validate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production client
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  connected-rating:
    name: Connected rating integrity
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connected-rating]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only live rating integrity audit
        env: &live-rating-read-environment
          RUN_LIVE_RATING_INTEGRITY: "1"
          RUN_LIVE_RATING_RECONCILIATION: "1"
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
        shell: bash
        run: |
          mkdir -p artifacts/rating-integrity
          node scripts/audit-live-rating-integrity.js | tee artifacts/rating-integrity/summary.json
      - name: Run live reconciliation dry-run
        env: *live-rating-read-environment
        shell: bash
        run: npm run reconcile:rating:live | tee artifacts/rating-integrity/reconciliation-preflight.json
      - name: Retain redacted rating integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-rating-${{ github.sha }}
          path: artifacts/rating-integrity/
          if-no-files-found: error
          retention-days: 30

