name: Pull request validation

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'codex/**'
      - 'agent/**'
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
      - 'governance/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate platform
        run: npm run platform:validate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production client
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  connected-bonus-mapping:
    name: Connected bonus mapping
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connected-rating]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only live bonus mapping audit
        env:
          RUN_LIVE_BONUS_MAPPING_AUDIT: "1"
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
        shell: bash
        run: |
          mkdir -p artifacts/bonus-rating-mapping
          node scripts/audit-live-bonus-rating-mapping.js | tee artifacts/bonus-rating-mapping/summary.json
      - name: Retain redacted bonus mapping evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-bonus-mapping-${{ github.sha }}
          path: artifacts/bonus-rating-mapping/
          if-no-files-found: error
          retention-days: 30

  connected-rating:
    name: Connected rating integrity
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connected-rating]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only live rating integrity audit
        env: &live-rating-read-environment
          RUN_LIVE_RATING_INTEGRITY: "1"
          RUN_LIVE_RATING_RECONCILIATION: "1"
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
        shell: bash
        run: |
          mkdir -p artifacts/rating-integrity
          node scripts/audit-live-rating-integrity.js | tee artifacts/rating-integrity/summary.json
      - name: Run live reconciliation dry-run
        env: *live-rating-read-environment
        shell: bash
        run: npm run reconcile:rating:live | tee artifacts/rating-integrity/reconciliation-preflight.json
      - name: Retain redacted rating integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-rating-${{ github.sha }}
          path: artifacts/rating-integrity/
          if-no-files-found: error
          retention-days: 30


  connected-cellar:
    name: Connected cellar integrity (read-only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connected-cellar]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only live cellar integrity audit
        env:
          RUN_LIVE_CELLAR_AUDIT: "1"
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
        shell: bash
        run: |
          mkdir -p artifacts/cellar-integrity
          node scripts/audit-live-cellar-integrity.js | tee artifacts/cellar-integrity/summary.json
      - name: Retain redacted cellar audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-cellar-${{ github.sha }}
          path: artifacts/cellar-integrity/
          if-no-files-found: error
          retention-days: 30

  anonymous-production-entry:
    name: Anonymous production entry (read-only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[public-access]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Check production entry without credentials or bypass headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = 'https://brew-buds-mobile-app-design-3577.vercel.app'
          checks = []
          versions = {}
          for route in ['/login', '/privacy', '/terms', '/moderation', '/support', '/retention', '/api/health', '/api/readiness']:
              check = {'route': route, 'pass': False}
              try:
                  request = urllib.request.Request(origin + route, headers={'Accept': 'application/json' if route.startswith('/api/') else 'text/html'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      same_origin = urllib.parse.urlsplit(response.url)[:2] == urllib.parse.urlsplit(origin)[:2]
                      body = response.read(65536)
                      check.update(httpStatus=response.status, sameOrigin=same_origin)
                      if route.startswith('/api/'):
                          payload = json.loads(body)
                          release = payload.get('release') or {}
                          sha = release.get('commitSha')
                          if isinstance(sha, str) and len(sha) == 40 and all(char in '0123456789abcdef' for char in sha):
                              versions[route] = sha
                          check['pass'] = same_origin and response.status == 200 and route in versions and release.get('environment') == 'production'
                          if route == '/api/health':
                              check['pass'] = check['pass'] and payload.get('status') == 'ok' and payload.get('service') == 'pourfolio'
                          if route == '/api/readiness':
                              check['pass'] = check['pass'] and payload.get('status') == 'ready' and payload.get('checks', {}).get('dataProvider') == 'ok'
                      else:
                          check['pass'] = same_origin and response.status == 200 and 'text/html' in response.headers.get('Content-Type', '')
              except urllib.error.HTTPError as error:
                  check.update(httpStatus=error.code, error='http-error')
              except (ValueError, TypeError):
                  check['error'] = 'unexpected-response'
              except Exception:
                  check['error'] = 'request-unavailable'
              checks.append(check)
          matching_release = len(versions) == 2 and len(set(versions.values())) == 1
          passed = all(check['pass'] for check in checks) and matching_release
          print(json.dumps({'status': 'PASS' if passed else 'BLOCKED', 'mode': 'anonymous-read-only', 'qualification': 'HTTP_ENTRY_ONLY', 'checks': checks, 'matchingRelease': matching_release, 'releaseSha': next(iter(versions.values()), None)}))
          sys.exit(0 if passed else 2)
          PY
