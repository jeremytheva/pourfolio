name: Read-only cellar recovery comparison

on:
  push:
    branches:
      - fix/launch-connected-evidence-20261025

permissions:
  contents: read
  actions: read

concurrency:
  group: bounded-current-instance-cellar-certification
  cancel-in-progress: false

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[connected-baseline-evidence]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BASE_URL: https://brew-buds-mobile-app-design-3577.vercel.app
      RELEASE_SHA: fec60da415c2f6cb75cd8f19bdc01a6731c5553a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Confirm the exact release checkout
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release origin and provenance
        id: release-target
        run: node scripts/verify-release-target.js
      - name: Build the reviewed release
        run: npm run build
      - name: Check the built release for server-only data
        run: npm run check:release-security
      - run: npx playwright install --with-deps chromium
      - name: Download the exact encrypted inspection receipt
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 12617127055
          run-id: 40241841492
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pourfolio-owned-cellar-source
          digest-mismatch: error
      - name: Run the existing baseline with private diagnostics
        env:
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
          RELEASE_OTHER_EMAIL: ${{ secrets.RELEASE_OTHER_EMAIL }}
          RELEASE_OTHER_PASSWORD: ${{ secrets.RELEASE_OTHER_PASSWORD }}
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
          CELLAR_SOURCE_DIRECTORY: ${{ runner.temp }}/pourfolio-owned-cellar-source
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/pourfolio-release-owner-${{ github.run_id }}.json
          RELEASE_DESTRUCTIVE_CONFIRMATION: ""
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          import { chromium } from '@playwright/test'
          import { signIn } from './release-check/support.js'
          import { normalizeAuthUser } from './src/hooks/useAuth.js'
          import { verifyReleaseTarget } from './release-check/releaseTarget.js'
          import { openBonusFixtureReceipt, sealBonusFixtureReceipt } from './scripts/bonus-fixture-receipt.js'
          
          const report = {
            version: 1, qualification: 'OWNER_CELLAR_RECOVERY_DRY_RUN', status: 'BLOCKED',
            releaseSha: process.env.RELEASE_SHA, observedAt: new Date().toISOString(),
            signInSession: 'NOT_RUN', cellarReadHttpStatus: null, totalOwnedRows: null,
            qaMarkerRows: null, qaPrefixRows: null, cellarMutationRequests: 0,
            blockedUnexpectedMutations: 0, sessionCleanup: 'NOT_RUN', privateDetails: 'NOT_PUBLISHED'
          }
          const fail = code => Object.assign(new Error(), { code })
          const codes = new Set(['CONFIGURATION_MISSING', 'CELLAR_SOURCE_RECEIPT_UNCONFIRMED', 'RELEASE_TARGET_UNVERIFIED',
            'OWNER_SESSION_UNCONFIRMED', 'CELLAR_READ_UNCONFIRMED', 'OWNED_QA_FIXTURE_PRESENT',
            'UNEXPECTED_MUTATION_BLOCKED', 'SESSION_CLEANUP_UNCONFIRMED', 'PRIVATE_CLEANUP_UNCONFIRMED'])
          const qaPattern = /^Pourfolio release QA cellar-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/
          let browser
          let context
          let verifiedBefore = false
          const verify = async () => {
            try { return await verifyReleaseTarget({ baseUrl: process.env.RELEASE_BASE_URL, releaseSha: process.env.RELEASE_SHA }) }
            catch { throw fail('RELEASE_TARGET_UNVERIFIED') }
          }
          try {
            if (!process.env.RELEASE_OWNER_EMAIL || !process.env.RELEASE_OWNER_PASSWORD) throw fail('CONFIGURATION_MISSING')
            const target = await verify()
            verifiedBefore = true
            report.provenanceBefore = 'PASS'
            browser = await chromium.launch()
            context = await browser.newContext({ baseURL: target.origin })
            await context.route('**/api/nocodebackend/**', route => {
              const request = route.request()
              const pathname = new URL(request.url()).pathname
              const method = request.method()
              const allowedAuth = method === 'POST' && [
                '/api/nocodebackend/auth/sign-in/email', '/api/nocodebackend/auth/sign-out'
              ].includes(pathname)
              if (['GET', 'HEAD', 'OPTIONS'].includes(method) || allowedAuth) return route.continue()
              report.blockedUnexpectedMutations += 1
              return route.abort('blockedbyclient')
            })
            const page = await context.newPage()
            await signIn(page, process.env.RELEASE_OWNER_EMAIL, process.env.RELEASE_OWNER_PASSWORD)
            const session = await context.request.get('/api/nocodebackend/auth/get-session', { timeout: 15000 })
            const user = session.status() === 200 ? normalizeAuthUser(await session.json().catch(() => null)) : null
            if (!user || String(user.email || '').trim().toLowerCase() !== process.env.RELEASE_OWNER_EMAIL.trim().toLowerCase()) {
              throw fail('OWNER_SESSION_UNCONFIRMED')
            }
            report.signInSession = 'PASS'
            const response = await context.request.get('/api/nocodebackend/cellar', { timeout: 20000 })
            report.cellarReadHttpStatus = response.status()
            const payload = response.status() === 200 ? await response.json().catch(() => null) : null
            if (!Array.isArray(payload?.items)) throw fail('CELLAR_READ_UNCONFIRMED')
            report.totalOwnedRows = payload.items.length
            report.qaMarkerRows = payload.items.filter(row => typeof row?.notes === 'string' && qaPattern.test(row.notes)).length
            const qaRows = payload.items.filter(row => typeof row?.notes === 'string' && row.notes.startsWith('Pourfolio release QA cellar-'))
            report.qaPrefixRows = qaRows.length
            const sourceFiles = fs.readdirSync(process.env.CELLAR_SOURCE_DIRECTORY, { recursive: true })
              .filter(file => path.basename(file) === 'recovery.json')
            if (sourceFiles.length !== 1) throw fail('CELLAR_SOURCE_RECEIPT_UNCONFIRMED')
            const source = openBonusFixtureReceipt(JSON.parse(fs.readFileSync(path.join(process.env.CELLAR_SOURCE_DIRECTORY, sourceFiles[0]), 'utf8')), process.env.NOCODEBACKEND_SECRET_KEY)
            if (source?.kind !== 'read-only-owned-http-cellar-inspection' || source.releaseSha !== report.releaseSha ||
                !Array.isArray(source.rows) || source.rows.length !== 1 || qaRows.length !== 1) throw fail('CELLAR_SOURCE_RECEIPT_UNCONFIRMED')
            const recorded = source.rows[0]
            const current = qaRows[0]
            if (String(recorded.id) !== String(current.id) || String(recorded.product_id) !== String(current.product_id) ||
                recorded.notes !== current.notes || !qaPattern.test(current.notes)) throw fail('CELLAR_SOURCE_RECEIPT_UNCONFIRMED')
            const { dataProvider } = await import('./api/_lib/dataProvider.js')
            const { verifyPersistedCellar } = await import('./api/cellar-data-proxy.js')
            const raw = await dataProvider.get('cellar', current.id, { fresh: true })
            if (!raw || String(raw.id) !== String(current.id) || String(raw.user_id) !== String(user.id) ||
                String(raw.product_id) !== String(current.product_id) || raw.notes !== current.notes) throw fail('CELLAR_SOURCE_RECEIPT_UNCONFIRMED')
            const allowedFields = new Set(['product_id', 'quantity', 'container', 'notes', 'date_received', 'user_id'])
            const compare = async expected => {
              try {
                await verifyPersistedCellar({ provider: { get: async () => raw }, id: raw.id, userId: user.id, expected, attempts: 1 })
                return { matches: true, mismatchFields: [] }
              } catch (error) {
                return { matches: false, mismatchFields: Array.isArray(error.mismatchFields)
                  ? error.mismatchFields.filter(field => allowedFields.has(field)) : [] }
              }
            }
            report.createShape = await compare({ product_id: current.product_id, quantity: 1, container: 'release-check', notes: current.notes, date_received: '2026-10-25' })
            report.updateShape = await compare({ product_id: current.product_id, quantity: 2, notes: current.notes })
            report.exactOwnerProviderRead = 'PASS'
            report.matchesInspectionIdentity = 'PASS'
            report.originalAttemptCorrelation = 'UNCONFIRMED'
            const canonical = value => JSON.stringify(Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b))))
            report.targetSha256 = createHash('sha256').update(canonical(raw)).digest('hex')
            const recovery = sealBonusFixtureReceipt({
              version: 1, kind: 'owner-reviewed-cellar-cleanup-plan-v1', releaseSha: report.releaseSha,
              capturedAt: new Date().toISOString(), target: raw, projectedTarget: current, ownerBaseline: payload.items,
              targetSha256: report.targetSha256, originalAttemptCorrelation: 'UNCONFIRMED'
            }, process.env.NOCODEBACKEND_SECRET_KEY)
            fs.mkdirSync('artifacts/launch-connected-evidence', { recursive: true })
            fs.writeFileSync('artifacts/launch-connected-evidence/recovery.json', JSON.stringify(recovery) + '\n', { mode: 0o600 })
            report.fullRawTargetBackup = 'ENCRYPTED_AND_RETAINED'
            report.requiredAction = 'OWNER_AUTHORIZATION_FOR_THIS_SINGLE_QA_RECORD'
                      if (report.blockedUnexpectedMutations > 0) throw fail('UNEXPECTED_MUTATION_BLOCKED')
            if (report.qaPrefixRows > 0) {
              report.status = 'REVIEW_REQUIRED'
              report.blocker = 'OWNED_QA_FIXTURE_PRESENT'
            } else {
              report.status = 'PASS'
              report.fixtureState = 'NO_OWNED_QA_MARKER_OBSERVED'
            }
          } catch (error) {
            report.status = 'BLOCKED'
            report.blocker = codes.has(error?.code) ? error.code : 'CELLAR_INSPECTION_UNAVAILABLE'
          } finally {
            if (context) {
              try {
                const signedOut = await context.request.post('/api/nocodebackend/auth/sign-out', {
                  data: {}, headers: { origin: process.env.RELEASE_BASE_URL }, timeout: 15000
                })
                if (!signedOut.ok()) throw fail('SESSION_CLEANUP_UNCONFIRMED')
                report.sessionCleanup = 'PASS'
              } catch {
                report.status = 'BLOCKED'
                report.blocker = 'SESSION_CLEANUP_UNCONFIRMED'
                report.sessionCleanup = 'UNCONFIRMED'
              }
            }
            try {
              await context?.close()
              await browser?.close()
              if (process.env.RELEASE_OWNER_SESSION_PATH) fs.rmSync(process.env.RELEASE_OWNER_SESSION_PATH, { force: true })
              report.privateWorkspaceCleanup = 'PASS'
            } catch {
              report.status = 'BLOCKED'
              report.blocker = 'PRIVATE_CLEANUP_UNCONFIRMED'
              report.privateWorkspaceCleanup = 'UNCONFIRMED'
            }
            if (verifiedBefore) {
              try { await verify(); report.provenanceAfter = 'PASS' }
              catch { report.status = 'BLOCKED'; report.blocker = 'RELEASE_TARGET_UNVERIFIED'; report.provenanceAfter = 'UNVERIFIED' }
            }
            report.completedAt = new Date().toISOString()
            fs.mkdirSync('artifacts/launch-connected-evidence', { recursive: true })
            fs.writeFileSync('artifacts/launch-connected-evidence/summary.json', JSON.stringify(report, null, 2) + '\n')
            process.stdout.write(JSON.stringify(report) + '\n')
          }
          if (report.status !== 'PASS') process.exitCode = 2
          JS
      - name: Reverify release origin and provenance
        if: always() && steps.release-target.outcome == 'success'
        run: node scripts/verify-release-target.js
      - name: Remove private diagnostic and session files
        if: always()
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/pourfolio-release-owner-${{ github.run_id }}.json
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          for (const name of fs.readdirSync(process.env.RUNNER_TEMP)) {
            if (name.startsWith('pourfolio-connected-evidence-')) {
              fs.rmSync(path.join(process.env.RUNNER_TEMP, name), { recursive: true, force: true })
            }
          }
          fs.rmSync(process.env.RELEASE_OWNER_SESSION_PATH, { force: true })
          fs.rmSync('test-results/release-check', { recursive: true, force: true })
          fs.rmSync('playwright-report/release-check', { recursive: true, force: true })
          JS
      - name: Retain only the redacted baseline summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-owned-cellar-recovery-plan-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: |
            artifacts/launch-connected-evidence/summary.json
            artifacts/launch-connected-evidence/recovery.json
          if-no-files-found: error
          retention-days: 30
