name: Reviewed single QA cellar recovery

on:
  push:
    branches:
      - fix/launch-connected-evidence-20261025

permissions:
  contents: read
  actions: read

concurrency:
  group: bounded-current-instance-cellar-certification
  cancel-in-progress: false

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[apply-reviewed-cellar-cleanup]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BASE_URL: https://brew-buds-mobile-app-design-3577.vercel.app
      RELEASE_SHA: fec60da415c2f6cb75cd8f19bdc01a6731c5553a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Confirm the exact release checkout
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release origin and provenance
        id: release-target
        run: node scripts/verify-release-target.js
      - name: Build the reviewed release
        run: npm run build
      - name: Check the built release for server-only data
        run: npm run check:release-security
      - run: npx playwright install --with-deps chromium
      - name: Download the exact encrypted inspection receipt
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 12617575916
          run-id: 40242334490
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pourfolio-owned-cellar-source
          digest-mismatch: error
      - name: Run the existing baseline with private diagnostics
        env:
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
          RELEASE_OTHER_EMAIL: ${{ secrets.RELEASE_OTHER_EMAIL }}
          RELEASE_OTHER_PASSWORD: ${{ secrets.RELEASE_OTHER_PASSWORD }}
          NOCODEBACKEND_SECRET_KEY: ${{ secrets.NOCODEBACKEND_SECRET_KEY }}
          NOCODEBACKEND_DATA_BASE_URL: https://api.nocodebackend.com/
          NOCODEBACKEND_INSTANCE: ${{ vars.NOCODEBACKEND_INSTANCE }}
          CELLAR_SOURCE_DIRECTORY: ${{ runner.temp }}/pourfolio-owned-cellar-source
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/pourfolio-release-owner-${{ github.run_id }}.json
          RELEASE_DESTRUCTIVE_CONFIRMATION: ""
          CELLAR_QA_CLEANUP_CONFIRMATION: REMOVE THE SINGLE REVIEWED QA CELLAR RECORD
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          import { chromium } from '@playwright/test'
          import { signIn } from './release-check/support.js'
          import { normalizeAuthUser } from './src/hooks/useAuth.js'
          import { verifyReleaseTarget } from './release-check/releaseTarget.js'
          import { openBonusFixtureReceipt, sealBonusFixtureReceipt } from './scripts/bonus-fixture-receipt.js'
          
          const expectedTargetSha256 = '1c8e0ec1278a28e426f6cb041d1790c26dcc4fe650d4b3b413efddd5fd0ee1ed'
          const report = {
            version: 1, qualification: 'OWNER_AUTHORIZED_SINGLE_QA_CELLAR_RECOVERY', status: 'BLOCKED',
            releaseSha: process.env.RELEASE_SHA, targetSha256: expectedTargetSha256,
            observedAt: new Date().toISOString(), deletesAttempted: 0, removed: 0,
            originalAttemptCorrelation: 'UNCONFIRMED', cleanup: 'NOT_RUN', sessionCleanup: 'NOT_RUN'
          }
          const fail = code => Object.assign(new Error(), { code })
          const codes = new Set(['RECOVERY_EXECUTION_GUARD_MISSING', 'RECOVERY_PLAN_UNCONFIRMED',
            'RELEASE_TARGET_UNVERIFIED', 'OWNER_SESSION_UNCONFIRMED', 'TARGET_DRIFT',
            'OWNER_BASELINE_UNCONFIRMED', 'DELETE_UNCONFIRMED', 'POST_DELETE_UNCONFIRMED',
            'SESSION_CLEANUP_UNCONFIRMED', 'PRIVATE_CLEANUP_UNCONFIRMED'])
          const canonical = value => JSON.stringify(Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b))))
          const digest = value => createHash('sha256').update(canonical(value)).digest('hex')
          let browser
          let context
          let plan
          let before
          let verifiedBefore = false
          const verify = async () => {
            try { return await verifyReleaseTarget({ baseUrl: process.env.RELEASE_BASE_URL, releaseSha: process.env.RELEASE_SHA }) }
            catch { throw fail('RELEASE_TARGET_UNVERIFIED') }
          }
          const checkpoint = stage => {
            const receipt = sealBonusFixtureReceipt({
              version: 1, kind: 'owner-authorized-single-qa-cellar-recovery-v1', stage,
              releaseSha: report.releaseSha, targetSha256: expectedTargetSha256,
              sourcePlan: plan, targetBefore: before, deletesAttempted: report.deletesAttempted,
              observedAt: new Date().toISOString(), originalAttemptCorrelation: 'UNCONFIRMED'
            }, process.env.NOCODEBACKEND_SECRET_KEY)
            const file = 'artifacts/launch-connected-evidence/recovery.json'
            fs.mkdirSync(path.dirname(file), { recursive: true })
            fs.writeFileSync(file + '.tmp', JSON.stringify(receipt) + '\n', { mode: 0o600 })
            fs.renameSync(file + '.tmp', file)
          }
          try {
            if (process.env.CELLAR_QA_CLEANUP_CONFIRMATION !== 'REMOVE THE SINGLE REVIEWED QA CELLAR RECORD' ||
                !process.env.RELEASE_OWNER_EMAIL || !process.env.RELEASE_OWNER_PASSWORD ||
                !process.env.NOCODEBACKEND_SECRET_KEY) throw fail('RECOVERY_EXECUTION_GUARD_MISSING')
            const sourceFiles = fs.readdirSync(process.env.CELLAR_SOURCE_DIRECTORY, { recursive: true })
              .filter(file => path.basename(file) === 'recovery.json')
            if (sourceFiles.length !== 1) throw fail('RECOVERY_PLAN_UNCONFIRMED')
            plan = openBonusFixtureReceipt(JSON.parse(fs.readFileSync(path.join(process.env.CELLAR_SOURCE_DIRECTORY, sourceFiles[0]), 'utf8')), process.env.NOCODEBACKEND_SECRET_KEY)
            if (plan?.kind !== 'owner-reviewed-cellar-cleanup-plan-v1' || plan.version !== 1 ||
                plan.targetSha256 !== expectedTargetSha256 || digest(plan.target || {}) !== expectedTargetSha256 ||
                !/^[1-9]\d*$/.test(String(plan.target.id)) ||
                !/^Pourfolio release QA cellar-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(plan.target.notes || '') ||
                !Array.isArray(plan.ownerBaseline)) throw fail('RECOVERY_PLAN_UNCONFIRMED')
            const target = await verify()
            verifiedBefore = true
            report.provenanceBefore = 'PASS'
            browser = await chromium.launch()
            context = await browser.newContext({ baseURL: target.origin })
            const page = await context.newPage()
            await signIn(page, process.env.RELEASE_OWNER_EMAIL, process.env.RELEASE_OWNER_PASSWORD)
            const session = await context.request.get('/api/nocodebackend/auth/get-session', { timeout: 15000 })
            const user = session.status() === 200 ? normalizeAuthUser(await session.json().catch(() => null)) : null
            if (!user || String(user.email || '').trim().toLowerCase() !== process.env.RELEASE_OWNER_EMAIL.trim().toLowerCase() ||
                String(plan.target.user_id) !== String(user.id)) throw fail('OWNER_SESSION_UNCONFIRMED')
            const { dataProvider } = await import('./api/_lib/dataProvider.js')
            before = await dataProvider.get('cellar', plan.target.id, { fresh: true })
            if (!before || digest(before) !== expectedTargetSha256 ||
                String(before.user_id) !== String(user.id)) throw fail('TARGET_DRIFT')
            const ownerResponse = await context.request.get('/api/nocodebackend/cellar', { timeout: 20000 })
            const owner = ownerResponse.status() === 200 ? await ownerResponse.json().catch(() => null) : null
            if (!Array.isArray(owner?.items)) throw fail('OWNER_BASELINE_UNCONFIRMED')
            const exact = owner.items.filter(row => String(row.id) === String(before.id) &&
              String(row.product_id) === String(before.product_id) && row.notes === before.notes)
            if (exact.length !== 1 || owner.items.filter(row => typeof row.notes === 'string' &&
                row.notes.startsWith('Pourfolio release QA cellar-')).length !== 1) throw fail('OWNER_BASELINE_UNCONFIRMED')
            const otherRows = owner.items.filter(row => String(row.id) !== String(before.id))
            report.exactTargetPreflight = 'PASS'
            checkpoint('delete-intent')
            report.encryptedBeforeReceipt = 'RETAINED'
            report.deletesAttempted = 1
            const deleted = await context.request.delete('/api/nocodebackend/cellar/' + encodeURIComponent(before.id), {
              headers: { origin: target.origin }, timeout: 15000, maxRetries: 0
            })
            report.deleteHttpStatus = deleted.status()
            checkpoint('delete-response')
            if (deleted.status() !== 204) throw fail('DELETE_UNCONFIRMED')
            const stored = await dataProvider.get('cellar', before.id, { fresh: true })
            const afterResponse = await context.request.get('/api/nocodebackend/cellar', { timeout: 20000 })
            const after = afterResponse.status() === 200 ? await afterResponse.json().catch(() => null) : null
            if (stored !== null || !Array.isArray(after?.items) ||
                after.items.some(row => String(row.id) === String(before.id) || row.notes === before.notes)) throw fail('POST_DELETE_UNCONFIRMED')
            const rowsDigest = rows => JSON.stringify(rows.map(canonical).sort())
            if (rowsDigest(after.items) !== rowsDigest(otherRows)) throw fail('POST_DELETE_UNCONFIRMED')
            report.cleanup = 'PASS'
            report.removed = 1
            report.otherOwnedRowsPreserved = 'PASS'
            report.status = 'PASS'
            checkpoint('finished')
          } catch (error) {
            report.status = 'BLOCKED'
            report.blocker = codes.has(error?.code) ? error.code : 'SINGLE_QA_RECOVERY_UNAVAILABLE'
            if (report.deletesAttempted) report.cleanup = 'UNCONFIRMED'
          } finally {
            if (context) {
              try {
                const signedOut = await context.request.post('/api/nocodebackend/auth/sign-out', {
                  data: {}, headers: { origin: process.env.RELEASE_BASE_URL }, timeout: 15000, maxRetries: 0
                })
                if (!signedOut.ok()) throw fail('SESSION_CLEANUP_UNCONFIRMED')
                report.sessionCleanup = 'PASS'
              } catch {
                report.status = 'BLOCKED'; report.blocker = 'SESSION_CLEANUP_UNCONFIRMED'; report.sessionCleanup = 'UNCONFIRMED'
              }
            }
            try {
              await context?.close()
              await browser?.close()
              if (process.env.RELEASE_OWNER_SESSION_PATH) fs.rmSync(process.env.RELEASE_OWNER_SESSION_PATH, { force: true })
              report.privateWorkspaceCleanup = 'PASS'
            } catch {
              report.status = 'BLOCKED'; report.blocker = 'PRIVATE_CLEANUP_UNCONFIRMED'; report.privateWorkspaceCleanup = 'UNCONFIRMED'
            }
            if (verifiedBefore) {
              try { await verify(); report.provenanceAfter = 'PASS' }
              catch { report.status = 'BLOCKED'; report.blocker = 'RELEASE_TARGET_UNVERIFIED' }
            }
            report.completedAt = new Date().toISOString()
            fs.mkdirSync('artifacts/launch-connected-evidence', { recursive: true })
            fs.writeFileSync('artifacts/launch-connected-evidence/summary.json', JSON.stringify(report, null, 2) + '\n')
            process.stdout.write(JSON.stringify(report) + '\n')
          }
          if (report.status !== 'PASS') process.exitCode = 2
          JS
      - name: Reverify release origin and provenance
        if: always() && steps.release-target.outcome == 'success'
        run: node scripts/verify-release-target.js
      - name: Remove private diagnostic and session files
        if: always()
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/pourfolio-release-owner-${{ github.run_id }}.json
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          for (const name of fs.readdirSync(process.env.RUNNER_TEMP)) {
            if (name.startsWith('pourfolio-connected-evidence-')) {
              fs.rmSync(path.join(process.env.RUNNER_TEMP, name), { recursive: true, force: true })
            }
          }
          fs.rmSync(process.env.RELEASE_OWNER_SESSION_PATH, { force: true })
          fs.rmSync('test-results/release-check', { recursive: true, force: true })
          fs.rmSync('playwright-report/release-check', { recursive: true, force: true })
          JS
      - name: Retain only the redacted baseline summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-reviewed-cellar-recovery-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: |
            artifacts/launch-connected-evidence/summary.json
            artifacts/launch-connected-evidence/recovery.json
          if-no-files-found: error
          retention-days: 30
