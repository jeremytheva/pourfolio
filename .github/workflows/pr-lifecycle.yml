name: PR lifecycle

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

# pull_request_target runs in the base-repository trust context. Default to no
# token authority and grant each job only the mutation it actually performs.
permissions: {}

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-pull-request-state:
    if: github.event.action != 'closed'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Synchronise lifecycle label
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const lifecycleLabels = [
              ['pr:draft', 'Pull request is intentionally incomplete or non-reviewable', '6f42c1'],
              ['pr:implementing', 'Implementation is actively changing', '1d76db'],
              ['pr:validating', 'Project-owned validation is being assessed', 'fbca04'],
              ['pr:ready', 'Implementation gate and project-owned validation are sufficient', '0e8a16'],
              ['pr:mergeable', 'Project-owned merge conditions are satisfied', '0e8a16'],
              ['pr:blocked', 'A material dependency or decision blocks progression', 'b60205'],
            ];

            for (const [name, description, color] of lifecycleLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, description, color });
              }
            }

            const managed = lifecycleLabels.map(([name]) => name).filter((name) => name !== 'pr:blocked');
            const current = pr.labels.map((label) => label.name);
            const currentManaged = current.filter((label) => managed.includes(label));

            // GitHub Draft is exceptional. It can force the presentation label to
            // pr:draft, but normal non-draft PRs retain their explicit project-owned
            // lifecycle label. A new normal PR starts at pr:implementing; automation
            // must not infer Ready/Mergeable from GitHub-native state or CI conclusions.
            let target = null;
            if (pr.draft) {
              target = 'pr:draft';
            } else if (currentManaged.includes('pr:draft') || currentManaged.length === 0) {
              target = 'pr:implementing';
            }

            if (target) {
              for (const label of managed) {
                if (label !== target && current.includes(label)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
              }

              if (!current.includes(target)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [target] });
              }
            }

  delete-merged-branch:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
