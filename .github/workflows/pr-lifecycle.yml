name: PR lifecycle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

# Default to no token authority. Fork and Dependabot tokens remain read-only;
# metadata/cleanup failures must not block implementation or acceptance.
permissions: {}

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-pull-request-state:
    if: github.event.action != 'closed'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Synchronise lifecycle label
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const managed = [
              'pr:draft',
              'pr:implementing',
              'pr:validating',
              'pr:ready',
              'pr:mergeable',
            ];
            const current = pr.labels.map((label) => label.name);
            const currentManaged = current.filter((label) => managed.includes(label));

            // Lifecycle labels are governed repository metadata and are provisioned
            // outside the per-PR synchronisation path. Keep this workflow focused on
            // state synchronisation rather than mutating label definitions every run.
            // GitHub Draft remains exceptional; normal PRs start at Implementing and
            // retain explicit project-owned progression thereafter.
            let target = null;
            if (pr.draft) {
              target = 'pr:draft';
            } else if (currentManaged.includes('pr:draft') || currentManaged.length === 0) {
              target = 'pr:implementing';
            }

            if (!target) return;

            // Add first: a refused mutation must not erase the existing state.
            if (!current.includes(target)) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [target] });
              } catch (error) {
                core.warning(`Lifecycle label sync unavailable (HTTP ${error.status ?? 'unknown'}). Labels are advisory; continue project-owned validation and PR work.`);
                return;
              }
            }

            for (const label of managed) {
              if (label !== target && current.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label });
                } catch (error) {
                  if (error.status !== 404) core.warning(`Lifecycle label removal unavailable (HTTP ${error.status ?? 'unknown'}).`);
                }
              }
            }

  delete-merged-branch:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) core.warning(`Merged branch cleanup unavailable (HTTP ${error.status ?? 'unknown'}). Preserve the branch for later safe cleanup.`);
            }
