name: Bounded Add Beer read-only evidence
on:
  push:
    branches: [fix/add-beer-connected-evidence-20261027]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: bounded-current-instance-cellar-certification
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.ref == 'refs/heads/fix/add-beer-connected-evidence-20261027' &&
      contains(github.event.head_commit.message, '[qualify-add-beer-candidate-97311ddf]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: 97311ddf92a61ae6cce57630b85d79540686a181
      RELEASE_BASE_URL: https://pourfolio-wudz1vlku-jeremythevas-projects.vercel.app
      RELEASE_EVIDENCE_DIRECTORY: artifacts/add-beer-readonly
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 97311ddf92a61ae6cce57630b85d79540686a181
          persist-credentials: false
      - name: Verify reviewed source
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare a single-run access key
        shell: bash
        run: |
          umask 077
          cat > "$RUNNER_TEMP/add-beer-access-handoff.mjs" <<'HANDOFF'
          import fs from 'node:fs'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          import { constants, createHash, createPrivateKey, createPublicKey, generateKeyPairSync, privateDecrypt } from 'node:crypto'
          
          export const REPOSITORY = 'jeremytheva/pourfolio'
          export const SOURCE_SHA = '97311ddf92a61ae6cce57630b85d79540686a181'
          export const ORIGIN = 'https://pourfolio-wudz1vlku-jeremythevas-projects.vercel.app'
          export const PULL_URL = 'https://api.github.com/repos/jeremytheva/pourfolio/pulls/697'
          export const MANIFEST_PATH = 'artifacts/add-beer-access-key/public-key.json'
          const bindingFields = ['version', 'repo', 'pr', 'runId', 'runAttempt', 'workerSha', 'sourceSha', 'origin', 'createdAt', 'expiresAt', 'fingerprint']
          class HandoffError extends Error { constructor(code) { super(code); this.code = code } }
          const requireThat = (value, code) => { if (!value) throw new HandoffError(code) }
          const closed = (value, fields) => value && Object.getPrototypeOf(value) === Object.prototype &&
            Object.keys(value).length === fields.length && fields.every(key => Object.hasOwn(value, key))
          const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value)
          const positive = value => typeof value === 'string' && /^[1-9]\d{0,19}$/.test(value)
          const fingerprintFor = key => createHash('sha256').update(createPublicKey(key).export({ type: 'spki', format: 'der' })).digest('hex')
          const timestamp = value => typeof value === 'string' && Number.isFinite(Date.parse(value)) && new Date(value).toISOString() === value
          
          export const bindingFor = manifest => Object.fromEntries(bindingFields.map(key => [key, manifest[key]]))
          export const bindingLabel = manifest => Buffer.from(JSON.stringify(bindingFor(manifest)), 'utf8')
          
          export function validateManifest(manifest, now = Date.now()) {
            requireThat(closed(manifest, [...bindingFields, 'publicKey']), 'MANIFEST_INVALID')
            requireThat(manifest.version === 1 && manifest.repo === REPOSITORY && manifest.pr === 697 &&
              positive(manifest.runId) && positive(manifest.runAttempt) && sha(manifest.workerSha) &&
              manifest.sourceSha === SOURCE_SHA && manifest.origin === ORIGIN &&
              typeof manifest.fingerprint === 'string' && /^[a-f0-9]{64}$/.test(manifest.fingerprint) &&
              typeof manifest.publicKey === 'string' && manifest.publicKey.length < 2048 &&
              timestamp(manifest.createdAt) && timestamp(manifest.expiresAt), 'MANIFEST_INVALID')
            const created = Date.parse(manifest.createdAt), expires = Date.parse(manifest.expiresAt)
            requireThat(created <= now && expires > now && expires > created && expires - created <= 600_000, 'MANIFEST_EXPIRED')
            let key
            try { key = createPublicKey(manifest.publicKey) } catch { throw new HandoffError('PUBLIC_KEY_INVALID') }
            requireThat(key.asymmetricKeyType === 'rsa' && key.asymmetricKeyDetails.modulusLength === 4096 &&
              key.export({ type: 'spki', format: 'pem' }) === manifest.publicKey &&
              fingerprintFor(manifest.publicKey) === manifest.fingerprint, 'PUBLIC_KEY_INVALID')
            return manifest
          }
          
          export function createManifest({ publicKey, runId, runAttempt, workerSha, sourceSha = SOURCE_SHA, origin = ORIGIN, now = Date.now() }) {
            const manifest = { version: 1, repo: REPOSITORY, pr: 697, runId, runAttempt, workerSha, sourceSha, origin,
              createdAt: new Date(now).toISOString(), expiresAt: new Date(now + 600_000).toISOString(),
              fingerprint: fingerprintFor(publicKey), publicKey }
            return validateManifest(manifest, now)
          }
          
          export function validateEnvelope(envelope, manifest, now = Date.now()) {
            validateManifest(manifest, now)
            requireThat(closed(envelope, [...bindingFields, 'ciphertext']), 'ENVELOPE_INVALID')
            requireThat(bindingFields.every(key => envelope[key] === manifest[key]), 'BINDING_MISMATCH')
            requireThat(typeof envelope.ciphertext === 'string' && /^[A-Za-z0-9+/]{683}=$/.test(envelope.ciphertext) &&
              Buffer.from(envelope.ciphertext, 'base64').length === 512 &&
              Buffer.from(envelope.ciphertext, 'base64').toString('base64') === envelope.ciphertext, 'CIPHERTEXT_INVALID')
            return envelope
          }
          
          export function extractEnvelope(body, manifest) {
            requireThat(typeof body === 'string' && Buffer.byteLength(body) <= 262_144, 'PULL_BODY_INVALID')
            const prefix = '<!-- pourfolio-preview-access:', count = body.split(prefix).length - 1
            if (!count) return null
            requireThat(count === 1, 'DUPLICATE_BLOCK')
            const rest = body.slice(body.indexOf(prefix) + prefix.length), newline = rest.indexOf('\n'), end = rest.indexOf('\n-->')
            requireThat(newline >= 0 && end > newline && rest.indexOf('-->') === end + 1, 'BLOCK_INVALID')
            requireThat(rest.slice(0, newline) === `${manifest.runId}:${manifest.runAttempt}:${manifest.workerSha}`, 'STALE_BLOCK')
            let envelope
            const encoded = rest.slice(newline + 1, end)
            try { envelope = JSON.parse(encoded) } catch { throw new HandoffError('BLOCK_INVALID') }
            requireThat(closed(envelope, [...bindingFields, 'ciphertext']), 'ENVELOPE_INVALID')
            requireThat(encoded === JSON.stringify(envelope), 'BLOCK_INVALID')
            return envelope
          }
          
          export function validateShareUrl(value, origin = ORIGIN) {
            requireThat(typeof value === 'string' && Buffer.byteLength(value) <= 400 && value.length > 0 &&
              value === value.trim() && value.startsWith(origin + '/?') && !/[\u0000-\u0020\u007f]/u.test(value), 'SHARE_URL_INVALID')
            let url
            try { url = new URL(value) } catch { throw new HandoffError('SHARE_URL_INVALID') }
            const entries = [...url.searchParams]
            requireThat(origin === ORIGIN && url.origin === origin && url.protocol === 'https:' &&
              !url.username && !url.password && !value.includes('#') && url.pathname === '/' &&
              entries.length === 1 && entries[0][0] === '_vercel_share' && entries[0][1].length > 0, 'SHARE_URL_INVALID')
            return value
          }
          
          export function decryptEnvelope(envelope, manifest, privateKey, now = Date.now()) {
            validateEnvelope(envelope, manifest, now)
            let key, plaintext
            try {
              key = createPrivateKey(privateKey)
              requireThat(key.asymmetricKeyType === 'rsa' && key.asymmetricKeyDetails.modulusLength === 4096 &&
                fingerprintFor(key) === manifest.fingerprint, 'PRIVATE_KEY_INVALID')
              plaintext = privateDecrypt({ key, padding: constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: 'sha256', oaepLabel: bindingLabel(manifest) }, Buffer.from(envelope.ciphertext, 'base64'))
            } catch (error) { throw error instanceof HandoffError ? error : new HandoffError('DECRYPT_FAILED') }
            const value = plaintext.toString('utf8')
            requireThat(Buffer.from(value, 'utf8').equals(plaintext), 'SHARE_URL_INVALID')
            return validateShareUrl(value, manifest.origin)
          }
          
          export function privatePaths(directory, manifest) {
            requireThat(typeof directory === 'string' && path.isAbsolute(directory), 'TEMP_PATH_INVALID')
            requireThat(positive(manifest.runId) && positive(manifest.runAttempt), 'MANIFEST_INVALID')
            const suffix = `${manifest.runId}-${manifest.runAttempt}`
            return { key: path.join(directory, `add-beer-access-key-${suffix}.pem`), url: path.join(directory, `add-beer-access-url-${suffix}.txt`) }
          }
          
          function assertRuntime(manifest, env) {
            requireThat(manifest.runId === env.GITHUB_RUN_ID && manifest.runAttempt === env.GITHUB_RUN_ATTEMPT &&
              manifest.workerSha === env.GITHUB_SHA && manifest.sourceSha === env.RELEASE_SHA && manifest.origin === env.RELEASE_BASE_URL,
            'RUNTIME_BINDING_MISMATCH')
          }
          
          export function prepare({ env = process.env, now = Date.now(), directory = path.resolve(MANIFEST_PATH) } = {}) {
            requireThat(positive(env.GITHUB_RUN_ID) && positive(env.GITHUB_RUN_ATTEMPT) && sha(env.GITHUB_SHA) &&
              env.RELEASE_SHA === SOURCE_SHA && env.RELEASE_BASE_URL === ORIGIN, 'RUNTIME_BINDING_MISMATCH')
            const keys = generateKeyPairSync('rsa', { modulusLength: 4096, publicExponent: 0x10001,
              publicKeyEncoding: { type: 'spki', format: 'pem' }, privateKeyEncoding: { type: 'pkcs8', format: 'pem' } })
            const manifest = createManifest({ publicKey: keys.publicKey, runId: env.GITHUB_RUN_ID,
              runAttempt: env.GITHUB_RUN_ATTEMPT, workerSha: env.GITHUB_SHA, now })
            const files = privatePaths(env.RUNNER_TEMP, manifest)
            fs.writeFileSync(files.key, keys.privateKey, { flag: 'wx', mode: 0o600 })
            fs.mkdirSync(path.dirname(directory), { recursive: true })
            fs.writeFileSync(directory, JSON.stringify(manifest) + '\n', { flag: 'wx', mode: 0o600 })
            return manifest
          }
          
          async function boundedJson(response) {
            const status = response?.status
            if (Number.isInteger(status) && status >= 100 && status <= 599 && status !== 200) {
              throw new HandoffError(`POLL_HTTP_${status}`)
            }
            requireThat(status === 200 && response.body, 'POLL_FAILED')
            const reader = response.body.getReader(), chunks = []; let length = 0
            try {
              while (true) {
                const { done, value } = await reader.read()
                if (done) break
                length += value.byteLength
                requireThat(length <= 262_144, 'POLL_RESPONSE_TOO_LARGE')
                chunks.push(value)
              }
              return JSON.parse(Buffer.concat(chunks).toString('utf8'))
            } catch (error) { throw error instanceof HandoffError ? error : new HandoffError('POLL_RESPONSE_INVALID') }
            finally { await reader.cancel().catch(() => {}) }
          }
          
          export async function receive({ env = process.env, manifestPath = path.resolve(MANIFEST_PATH),
            fetchImpl = fetch, now = Date.now, sleep = ms => new Promise(resolve => setTimeout(resolve, ms)) } = {}) {
            const files = privatePaths(env.RUNNER_TEMP, { runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT })
            try {
            let manifest
            try { manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8')) } catch { throw new HandoffError('MANIFEST_INVALID') }
            validateManifest(manifest, now()); assertRuntime(manifest, env)
            const token = env.GITHUB_TOKEN
            requireThat(typeof token === 'string' && token.length > 0 && token.length <= 4096 &&
              !/[^\u0021-\u007e]/u.test(token), 'POLL_TOKEN_INVALID')
            const stat = fs.lstatSync(files.key)
            requireThat(stat.isFile() && !stat.isSymbolicLink() && !(stat.mode & 0o077) && stat.size < 10_000, 'PRIVATE_KEY_INVALID')
            const privateKey = fs.readFileSync(files.key, 'utf8'), deadline = Math.min(now() + 180_000, Date.parse(manifest.expiresAt))
            for (let attempt = 0; attempt < 18 && now() < deadline; attempt += 1) {
              validateManifest(manifest, now())
              let payload
              try {
                payload = await boundedJson(await fetchImpl(PULL_URL, { redirect: 'error', signal: AbortSignal.timeout(Math.max(1, Math.min(5000, deadline - now()))),
                  headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'pourfolio-preview-access-handoff' } }))
              } catch (error) { throw error instanceof HandoffError ? error : new HandoffError('POLL_FAILED') }
              requireThat(now() < deadline, 'HANDOFF_TIMEOUT')
              requireThat(payload?.number === 697 && (payload.body === null || typeof payload.body === 'string'), 'POLL_RESPONSE_INVALID')
              const envelope = extractEnvelope(payload.body || '', manifest)
              if (envelope) {
                const value = decryptEnvelope(envelope, manifest, privateKey, now())
                fs.writeFileSync(files.url, value, { flag: 'wx', mode: 0o600 })
                return
              }
              if (attempt < 17 && now() < deadline) await sleep(Math.min(10_000, deadline - now()))
            }
            throw new HandoffError('HANDOFF_TIMEOUT')
            } finally {
              try { fs.rmSync(files.key, { force: true }) } catch { throw new HandoffError('PRIVATE_KEY_CLEANUP_UNCONFIRMED') }
            }
          }
          
          export async function runCli(argument, { write = value => process.stdout.write(value), prepareImpl = prepare, receiveImpl = receive } = {}) {
            const phase = ['prepare', 'receive'].includes(argument) ? argument : 'UNKNOWN'
            try {
              requireThat(phase !== 'UNKNOWN', 'INVALID_PHASE')
              if (phase === 'prepare') await prepareImpl(); else await receiveImpl()
              write(JSON.stringify({ phase, status: 'PASS', code: phase === 'prepare' ? 'KEY_READY' : 'ACCESS_READY' }) + '\n')
              return 0
            } catch (error) {
              write(JSON.stringify({ phase, status: 'BLOCKED', code: error instanceof HandoffError ? error.code : 'HANDOFF_FAILED' }) + '\n')
              return 1
            }
          }
          
          if (process.argv[1] && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href) process.exitCode = await runCli(process.argv[2])
          HANDOFF
          node "$RUNNER_TEMP/add-beer-access-handoff.mjs" prepare
      - name: Publish only the ephemeral public key
        uses: actions/upload-artifact@v7
        with:
          name: add-beer-access-key-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: artifacts/add-beer-access-key/public-key.json
      - name: Receive the encrypted one-run preview link
        id: handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node "$RUNNER_TEMP/add-beer-access-handoff.mjs" receive
      - name: Prepare bounded provenance verifier
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/add-beer-provenance.mjs" <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          const { request } = createRequire(path.resolve('package.json'))('@playwright/test')
          const { parseReleaseBaseUrl, verifyReleaseTarget } = await import(pathToFileURL(path.resolve('release-check/releaseTarget.js')))
          const stage = process.argv[2]
          if (!['preflight', 'postflight'].includes(stage)) process.exit(2)
          const statePath = path.join(process.env.RUNNER_TEMP, 'add-beer-preview-state-' + process.env.GITHUB_RUN_ID + '.json')
          const configPath = path.join(process.env.RUNNER_TEMP, 'add-beer-preview-config-' + process.env.GITHUB_RUN_ID + '.mjs')
          const report = { version: 1, stage, releaseSha: process.env.RELEASE_SHA, access: 'NOT_RUN', health: 'NOT_RUN', readiness: 'NOT_RUN', healthHttpStatus: null, readinessHttpStatus: null, blocker: null, status: 'BLOCKED' }
          const exactUrl = (value, origin) => {
            const url = new URL(value)
            if (url.origin !== origin || url.protocol !== 'https:' || url.username || url.password || url.hash) throw new Error('scope')
            return url
          }
          const configurationCodes = new Set(['SHARE_URL_MISSING', 'SHARE_URL_INVALID', 'SHARE_URL_ORIGIN_MISMATCH', 'SHARE_URL_SHAPE_INVALID'])
          const shareUrl = (value, origin) => {
            if (typeof value !== 'string' || !value) throw new Error('SHARE_URL_MISSING')
            if (value.length > 4096) throw new Error('SHARE_URL_INVALID')
            let url
            try { url = new URL(value) } catch { throw new Error('SHARE_URL_INVALID') }
            if (url.origin !== origin || url.protocol !== 'https:' || url.username || url.password || url.hash) throw new Error('SHARE_URL_ORIGIN_MISMATCH')
            const keys = [...url.searchParams.keys()]
            if (url.pathname !== '/' || keys.length !== 1 || keys[0] !== '_vercel_share' || !url.searchParams.get('_vercel_share')) throw new Error('SHARE_URL_SHAPE_INVALID')
            return url
          }
          const scopedState = (state, origin) => {
            const host = new URL(origin).hostname
            if (!state || !Array.isArray(state.origins) || state.origins.length || !Array.isArray(state.cookies) || !state.cookies.length ||
                state.cookies.some(cookie => !cookie || typeof cookie.domain !== 'string' || cookie.domain.replace(/^\./, '') !== host ||
                  typeof cookie.name !== 'string' || !cookie.name || typeof cookie.value !== 'string' || !cookie.value)) throw new Error('state')
            return { cookies: state.cookies, origins: [] }
          }
          let context
          try {
            const origin = parseReleaseBaseUrl(process.env.RELEASE_BASE_URL)
            let state
            if (stage === 'postflight') {
              const stat = fs.lstatSync(statePath)
              if (!stat.isFile() || stat.isSymbolicLink() || (stat.mode & 0o077) !== 0) throw new Error('state')
              state = scopedState(JSON.parse(fs.readFileSync(statePath, 'utf8')), origin)
            }
            context = await request.newContext({ ...(state ? { storageState: state } : {}) })
            const get = async value => {
              const url = exactUrl(value, origin)
              return context.get(url.href, { maxRedirects: 0, maxRetries: 0, timeout: 15000 })
            }
            if (stage === 'preflight') {
              const sharePath = path.join(process.env.RUNNER_TEMP, 'add-beer-access-url-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT + '.txt')
              let value
              try {
                const stat = fs.lstatSync(sharePath)
                if (!stat.isFile() || stat.isSymbolicLink() || (stat.mode & 0o077) !== 0 || stat.size > 400) throw new Error('state')
                value = fs.readFileSync(sharePath, 'utf8')
              } finally { fs.rmSync(sharePath, { force: true }) }
              let current = shareUrl(value, origin), complete = false
              value = undefined
              for (let hop = 0; hop < 5; hop += 1) {
                const response = await get(current.href)
                if ([301, 302, 303, 307, 308].includes(response.status())) {
                  const location = response.headers().location
                  if (!location || hop === 4) throw new Error('redirect')
                  current = exactUrl(new URL(location, current).href, origin)
                } else {
                  if (response.status() !== 200) throw new Error('access')
                  complete = true; break
                }
              }
              if (!complete) throw new Error('access')
              state = scopedState(await context.storageState(), origin)
            }
            report.access = 'PASS'
            const health = await get(origin + '/api/health')
            report.healthHttpStatus = health.status()
            if (health.status() !== 200) throw new Error('unverified')
            const body = await health.json()
            if (body.status !== 'ok' || body.service !== 'pourfolio' || body.release?.commitSha !== report.releaseSha || body.release?.environment !== 'preview') throw new Error('unverified')
            report.health = 'PASS'
            const verified = await verifyReleaseTarget({ baseUrl: origin, releaseSha: report.releaseSha, fetchImpl: async url => {
              const response = await get(url)
              report.readinessHttpStatus = response.status()
              return { status: response.status(), json: () => response.json() }
            } })
            if (verified.environment !== 'preview' || verified.dataProvider !== 'ok') throw new Error('unverified')
            report.readiness = 'PASS'
            if (stage === 'preflight') {
              state = scopedState(await context.storageState(), origin)
              fs.writeFileSync(statePath, JSON.stringify(state), { mode: 0o600, flag: 'wx' })
              const sourceConfig = pathToFileURL(path.resolve('playwright.release.config.js')).href
              const override = { testDir: path.resolve('release-check'), outputDir: path.resolve('test-results/release-check'),
                reporter: [[path.resolve('release-check/redactedReleaseReporter.js')]] }
              const code = 'import base from ' + JSON.stringify(sourceConfig) + ';\nexport default { ...base, ...' + JSON.stringify(override) +
                ', use: { ...base.use, trace: "off", screenshot: "off", video: "off", storageState: ' + JSON.stringify(statePath) + ' } };\n'
              fs.writeFileSync(configPath, code, { mode: 0o600, flag: 'wx' })
            }
            report.status = 'PASS'
          } catch (error) { report.status = 'BLOCKED'; report.blocker = configurationCodes.has(error?.message) ? error.message : 'PROTECTED_PREVIEW_UNVERIFIED' }
          try { await context?.dispose() } catch { report.status = 'BLOCKED'; report.blocker = 'PRIVATE_CONTEXT_CLEANUP_UNCONFIRMED' }
          fs.mkdirSync(process.env.RELEASE_EVIDENCE_DIRECTORY, { recursive: true })
          fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, stage + '.json'), JSON.stringify(report) + '\n', { mode: 0o600 })
          if (report.status !== 'PASS') process.exitCode = 1
          JS
      - name: Verify exact preview before credentials
        id: preflight
        shell: bash
        run: |
          umask 077
          provenance_exit_code=0
          node "$RUNNER_TEMP/add-beer-provenance.mjs" preflight > "$RUNNER_TEMP/add-beer-provenance-preflight-$GITHUB_RUN_ID.log" 2>&1 || provenance_exit_code=$?
          if test -f "$RELEASE_EVIDENCE_DIRECTORY/preflight.json"
          then
            cat "$RELEASE_EVIDENCE_DIRECTORY/preflight.json"
          else
            printf '%s\n' '{"status":"BLOCKED","stage":"preflight","code":"PROVENANCE_REPORT_UNAVAILABLE"}'
            provenance_exit_code=1
          fi
          exit "$provenance_exit_code"
      - name: Prove exactly one reviewed case is selected
        id: selection
        env:
          RELEASE_OWNER_EMAIL: source-selection@example.invalid
          RELEASE_OWNER_PASSWORD: source-selection-only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { spawnSync } from 'node:child_process'
          const args = ['node_modules/@playwright/test/cli.js', 'test', 'release-check/catalogue-readonly.spec.js', '--config=playwright.release.config.js', '--grep', 'connected Add Beer style choices use every authenticated canonical category page$', '--retries=0', '--workers=1', '--project=connected-chromium', '--list', '--reporter=json']
          const report = { version: 1, status: 'BLOCKED', caseId: 'catalogue-readonly.spec.js:65', selected: 0 }
          try {
            const child = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 30000, maxBuffer: 2 * 1024 * 1024 })
            if (child.error || child.status !== 0) throw new Error('selection')
            const collect = suite => [...(suite.specs || []), ...(suite.suites || []).flatMap(collect)]
            const specs = (JSON.parse(child.stdout).suites || []).flatMap(collect)
            const file = typeof specs[0]?.file === 'string' ? specs[0].file.replaceAll('\\', '/') : ''
            const canonicalFile = file === 'catalogue-readonly.spec.js' || path.resolve(file) === path.resolve('release-check/catalogue-readonly.spec.js')
            if (specs.length !== 1 || specs[0].title !== 'connected Add Beer style choices use every authenticated canonical category page' || specs[0].line !== 65 || !canonicalFile || specs[0].tests.length !== 1 || specs[0].tests[0].projectName !== 'connected-chromium') throw new Error('selection')
            report.selected = 1; report.status = 'PASS'
          } catch {}
          fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, 'selection.json'), JSON.stringify(report) + '\n', { mode: 0o600 })
          if (report.status !== 'PASS') process.exitCode = 1
          JS
      - name: Prepare the reviewed redacted diagnostic reporter
        shell: bash
        run: |
          umask 077
          cat > "$RUNNER_TEMP/add-beer-redacted-reporter.mjs" <<'REPORTER'
          import fs from 'node:fs'
          import path from 'node:path'
          
          const specFiles = Object.freeze([
            'connected.spec.js',
            'catalogue-evidence.spec.js',
            'catalogue-readonly.spec.js',
            'profile-history-readonly.spec.js'
          ])
          const testStatuses = Object.freeze({
            passed: 'PASS',
            failed: 'FAIL',
            timedOut: 'FAIL',
            interrupted: 'FAIL',
            skipped: 'SKIPPED'
          })
          const runStatuses = new Set(['passed', 'failed', 'timedout', 'interrupted'])
          const stepCategories = new Set(['expect', 'pw:api', 'test.step', 'hook'])
          const diagnosticHelpers = Object.freeze(['support.js', 'ownerSession.js'])
          const publicSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value) ? value : null
          const ownValue = (value, key) => {
            const descriptor = Object.getOwnPropertyDescriptor(value, key)
            if (!descriptor || !Object.hasOwn(descriptor, 'value')) throw new Error('INVALID_DIAGNOSTIC')
            return descriptor.value
          }
          
          // Playwright reporter for connected checks. Only source case IDs and fixed
          // outcomes are retained; test titles, errors, stdout and attachments are private.
          export default class RedactedReleaseReporter {
            constructor({
              env = process.env,
              rootDirectory = process.cwd(),
              fileSystem = fs,
              writeOutput = value => process.stdout.write(value)
            } = {}) {
              this.fileSystem = fileSystem
              this.writeOutput = writeOutput
              this.directory = path.resolve(rootDirectory,
                typeof env.RELEASE_EVIDENCE_DIRECTORY === 'string' && env.RELEASE_EVIDENCE_DIRECTORY.trim()
                  ? env.RELEASE_EVIDENCE_DIRECTORY : 'artifacts/connected-release')
              this.allowedFiles = new Map(specFiles.map(file =>
                [path.resolve(rootDirectory, 'release-check', file), file]))
              this.diagnosticHelpers = new Map(diagnosticHelpers.map(file =>
                [path.resolve(rootDirectory, 'release-check', file), file]))
              this.metadata = { releaseSha: publicSha(env.RELEASE_SHA), candidateSha: publicSha(env.GITHUB_SHA) }
              this.cases = new Map()
              this.stepDiagnostics = new Map()
              this.invalidDiagnostics = 0
              this.blockers = new Set()
              if (!this.metadata.releaseSha) this.block('RELEASE_IDENTITY_MISSING')
              this.discovered = 0
              this.invalidEvents = 0
              this.runnerErrors = 0
              this.started = false
            }
          
            block(code) {
              this.blockers.add(code)
            }
          
            caseId(test) {
              const location = test?.location
              if (typeof location?.file !== 'string' ||
                  !Number.isSafeInteger(location.line) || location.line < 1 || location.line > 100000) return null
              const file = this.allowedFiles.get(path.resolve(location.file))
              return file ? file + ':' + location.line : null
            }
          
            onBegin(_config, suite) {
              if (this.started) {
                this.block('DUPLICATE_BEGIN')
                return
              }
              this.started = true
              try {
                const tests = suite.allTests()
                if (!Array.isArray(tests) || tests.length > 10000) {
                  this.block('INVALID_SUITE')
                  return
                }
                this.discovered = tests.length
                for (const test of tests) {
                  const id = this.caseId(test)
                  if (!id) {
                    this.invalidEvents += 1
                    this.block('INVALID_CASE_IDENTITY')
                  } else if (this.cases.has(id)) {
                    this.invalidEvents += 1
                    this.block('DUPLICATE_CASE_IDENTITY')
                  } else {
                    this.cases.set(id, 'NOT_RUN')
                  }
                }
              } catch {
                this.block('INVALID_SUITE')
              }
            }
          
            onTestEnd(test, result) {
              try {
                const id = this.caseId(test)
                if (!this.started || !id || !this.cases.has(id)) {
                  this.invalidEvents += 1
                  this.block('UNEXPECTED_CASE_RESULT')
                  return
                }
                if (this.cases.get(id) !== 'NOT_RUN') {
                  this.invalidEvents += 1
                  this.cases.set(id, 'FAIL')
                  this.block('DUPLICATE_CASE_RESULT')
                  return
                }
                const status = result?.status
                if (typeof status !== 'string' || !Object.hasOwn(testStatuses, status)) {
                  this.invalidEvents += 1
                  this.cases.set(id, 'INVALID')
                  this.block('INVALID_TEST_STATUS')
                  return
                }
                this.cases.set(id, testStatuses[status])
              } catch {
                this.invalidEvents += 1
                this.block('INVALID_CASE_RESULT')
              }
            }
          
            onStdOut() {}
            onStdErr() {}
          
            onStepEnd(test, _result, step) {
              try {
                const error = Object.getOwnPropertyDescriptor(step, 'error')
                if (!error) return
                if (!Object.hasOwn(error, 'value')) throw new Error('INVALID_DIAGNOSTIC')
                if (!error.value) return
                const testLocation = ownValue(test, 'location')
                const testFile = ownValue(testLocation, 'file')
                const caseId = this.caseId({ location: { file: testFile, line: ownValue(testLocation, 'line') } })
                const location = ownValue(step, 'location')
                const file = ownValue(location, 'file')
                const line = ownValue(location, 'line')
                const category = ownValue(step, 'category')
                if (!this.started || !caseId || !this.cases.has(caseId) || typeof file !== 'string' ||
                    !Number.isSafeInteger(line) || line < 1 || line > 100000 || !stepCategories.has(category)) throw new Error('INVALID_DIAGNOSTIC')
                const resolvedFile = path.resolve(file)
                const sourceFile = resolvedFile === path.resolve(testFile) ? this.allowedFiles.get(resolvedFile) : this.diagnosticHelpers.get(resolvedFile)
                if (!sourceFile) throw new Error('INVALID_DIAGNOSTIC')
                const sourceId = sourceFile + ':' + line
                const key = JSON.stringify([caseId, sourceId, category])
                if (!this.stepDiagnostics.has(key) && this.stepDiagnostics.size >= 1000) throw new Error('INVALID_DIAGNOSTIC')
                this.stepDiagnostics.set(key, { caseId, sourceId, category, status: 'FAIL' })
              } catch {
                this.invalidDiagnostics = Math.min(10000, this.invalidDiagnostics + 1)
              }
            }
          
            onError() {
              this.runnerErrors += 1
              this.block('RUNNER_ERROR')
            }
          
            async onEnd(result) {
              let runnerStatus = 'unknown'
              try {
                const value = result?.status
                if (typeof value === 'string' && runStatuses.has(value)) runnerStatus = value
              } catch { /* Discard private runner exceptions. */ }
              if (runnerStatus === 'unknown') this.block('INVALID_RUN_STATUS')
              if (!this.started) this.block('MISSING_BEGIN')
              if (!this.discovered) this.block('NO_TESTS_DISCOVERED')
              const tests = [...this.cases].sort(([left], [right]) => left.localeCompare(right))
                .map(([caseId, status]) => ({ caseId, status }))
              const counts = {
                expected: this.discovered,
                passed: tests.filter(test => test.status === 'PASS').length,
                failed: tests.filter(test => test.status === 'FAIL').length,
                skipped: tests.filter(test => test.status === 'SKIPPED').length,
                notRun: 0
              }
              counts.notRun = Math.max(0, counts.expected - counts.passed - counts.failed - counts.skipped)
              if (counts.notRun) this.block('INCOMPLETE_RESULTS')
              const report = {
                version: 1,
                qualification: 'CONNECTED_RELEASE_CHECKS',
                ...this.metadata,
                status: this.blockers.size ? 'BLOCKED'
                  : runnerStatus !== 'passed' || counts.failed > 0 ? 'FAIL'
                    : counts.skipped > 0 ? 'PASS_WITH_SKIPS' : 'PASS',
                runnerStatus,
                counts,
                invalidEvents: this.invalidEvents,
                invalidDiagnostics: this.invalidDiagnostics,
                diagnostics: [...this.stepDiagnostics].sort(([left], [right]) => left.localeCompare(right)).map(([, value]) => value),
                runnerErrors: this.runnerErrors,
                blockers: [...this.blockers].sort(),
                tests
              }
              const blockReport = code => {
                if (!report.blockers.includes(code)) report.blockers.push(code)
                report.blockers.sort()
                report.status = 'BLOCKED'
              }
              const write = () => {
                const file = path.join(this.directory, 'release-summary.json')
                this.fileSystem.mkdirSync(this.directory, { recursive: true })
                this.fileSystem.writeFileSync(file + '.tmp', JSON.stringify(report, null, 2) + '\n', { mode: 0o600 })
                this.fileSystem.renameSync(file + '.tmp', file)
              }
              try {
                write()
              } catch {
                blockReport('REPORT_WRITE_FAILED')
              }
              try {
                this.writeOutput(JSON.stringify(report) + '\n')
              } catch {
                blockReport('REPORT_OUTPUT_FAILED')
                try { write() } catch { blockReport('REPORT_WRITE_FAILED') }
              }
              return {
                status: ['PASS', 'PASS_WITH_SKIPS'].includes(report.status) && runnerStatus === 'passed'
                  ? 'passed' : 'failed'
              }
            }
          
            printsToStdio() {
              // Prevent Playwright from adding a default reporter that prints errors.
              return true
            }
          }
          REPORTER
          node --input-type=module <<'VERIFY'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          const file = path.join(process.env.RUNNER_TEMP, 'add-beer-redacted-reporter.mjs')
          if (crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') !== '9ad70e1eb4dd0a58c400582a3c6ff99cd45c01f065d2315170f36e6f458d0c05') throw new Error('DIAGNOSTIC_REPORTER_MISMATCH')
          VERIFY
      - name: Run one read-only case and close its session
        id: browser
        if: success() && steps.preflight.outcome == 'success' && steps.selection.outcome == 'success'
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/add-beer-owner-${{ github.run_id }}.json
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
        shell: bash
        run: |
          umask 077
          node --input-type=module > "$RUNNER_TEMP/add-beer-private-$GITHUB_RUN_ID.log" 2>&1 <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import { spawnSync } from 'node:child_process'
          let browser, exitCode = 1, cleanup = 'UNCONFIRMED', cleanupHttpStatus = null
          let cleanupStage = 'SAVED_SESSION', cleanupFailure = null, restore = 'NOT_RUN', logout = 'NOT_RUN', probeIdentity = 'NOT_INSPECTED'
          try {
            const args = ['node_modules/@playwright/test/cli.js', 'test', 'release-check/catalogue-readonly.spec.js', '--config=' + path.join(process.env.RUNNER_TEMP, 'add-beer-preview-config-' + process.env.GITHUB_RUN_ID + '.mjs'), '--grep', 'connected Add Beer style choices use every authenticated canonical category page$', '--retries=0', '--workers=1', '--project=connected-chromium', '--reporter=' + path.join(process.env.RUNNER_TEMP, 'add-beer-redacted-reporter.mjs')]
            const child = spawnSync(process.execPath, args, { stdio: 'inherit', timeout: 180000 })
            exitCode = child.error || child.status !== 0 ? 1 : 0
          } catch {} finally {
            try {
              const file = process.env.RELEASE_OWNER_SESSION_PATH, stat = fs.lstatSync(file)
              if (!stat.isFile() || stat.isSymbolicLink() || (stat.mode & 0o077) !== 0) throw new Error('session')
              const saved = JSON.parse(fs.readFileSync(file, 'utf8')), origin = new URL(process.env.RELEASE_BASE_URL).origin
              const owner = crypto.createHash('sha256').update(process.env.RELEASE_OWNER_EMAIL.trim().toLowerCase()).digest('hex')
              if (saved.sha !== process.env.RELEASE_SHA || saved.origin !== origin || saved.owner !== owner || !Array.isArray(saved.cookies) || !saved.cookies.length || saved.cookies.some(cookie => !cookie || typeof cookie.domain !== 'string' || cookie.domain.replace(/^\./, '') !== new URL(origin).hostname || typeof cookie.name !== 'string' || !cookie.name || typeof cookie.value !== 'string' || !cookie.value)) throw new Error('session')
              const { chromium } = await import('@playwright/test')
              const { restoreReleaseOwnerSession } = await import('./release-check/ownerSession.js')
              const { signOut } = await import('./release-check/support.js')
              const { normalizeAuthUser } = await import('./src/hooks/useAuth.js')
              cleanupStage = 'BROWSER_START'
              browser = await chromium.launch()
              const context = await browser.newContext({ baseURL: origin }), page = await context.newPage()
              cleanupStage = 'RESTORE'
              restore = 'ATTEMPTED'
              const restored = await restoreReleaseOwnerSession(page, process.env.RELEASE_OWNER_EMAIL)
              restore = restored ? 'RESTORED' : 'NOT_RESTORED'
              if (restored) {
                cleanupStage = 'LOGOUT'
                logout = 'ATTEMPTED'
                await signOut(page)
                logout = 'PASS'
              }
              cleanupStage = 'CONTEXT_CLOSE'
              await context.close()
              cleanupStage = 'PROBE'
              const probe = await browser.newContext({ baseURL: origin })
              await probe.addCookies(saved.cookies)
              const response = await probe.request.get('/api/nocodebackend/auth/get-session', { maxRedirects: 0, maxRetries: 0 })
              cleanupHttpStatus = response.status()
              cleanup = cleanupHttpStatus === 401 ? 'PASS' : 'UNCONFIRMED'
              if (cleanupHttpStatus === 200) {
                try {
                  const body = await response.body()
                  if (!Buffer.isBuffer(body) || body.length > 65536) throw new Error('probe')
                  probeIdentity = normalizeAuthUser(JSON.parse(body.toString('utf8'))) ? 'PRESENT' : 'ABSENT'
                } catch { probeIdentity = 'UNAVAILABLE' }
              }
              await probe.close()
            } catch {
              cleanupFailure = cleanupStage
              if (cleanupStage === 'RESTORE') restore = 'FAIL'
              if (cleanupStage === 'LOGOUT') logout = 'FAIL'
              cleanup = 'UNCONFIRMED'
            }
            try { await browser?.close() } catch { cleanupFailure = 'BROWSER_CLOSE'; cleanup = 'UNCONFIRMED' }
            fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, 'session-cleanup.json'), JSON.stringify({ version: 1, session: cleanup, sessionHttpStatus: cleanupHttpStatus, restore, logout, probeIdentity, cleanupFailure }) + '\n', { mode: 0o600 })
          }
          process.exitCode = exitCode || (cleanup === 'PASS' ? 0 : 1)
          JS
      - name: Recheck exact preview after attempted browser case
        if: always() && steps.preflight.outcome == 'success' && steps.browser.outcome != 'skipped'
        shell: bash
        run: |
          umask 077
          provenance_exit_code=0
          node "$RUNNER_TEMP/add-beer-provenance.mjs" postflight > "$RUNNER_TEMP/add-beer-provenance-postflight-$GITHUB_RUN_ID.log" 2>&1 || provenance_exit_code=$?
          if test -f "$RELEASE_EVIDENCE_DIRECTORY/postflight.json"
          then
            cat "$RELEASE_EVIDENCE_DIRECTORY/postflight.json"
          else
            printf '%s\n' '{"status":"BLOCKED","stage":"postflight","code":"PROVENANCE_REPORT_UNAVAILABLE"}'
            provenance_exit_code=1
          fi
          exit "$provenance_exit_code"
      - name: Remove all private evidence before retention
        if: always()
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/add-beer-owner-${{ github.run_id }}.json
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const directory = process.env.RELEASE_EVIDENCE_DIRECTORY, file = path.join(directory, 'session-cleanup.json')
          let session = process.env.BROWSER_OUTCOME === 'skipped' || !process.env.BROWSER_OUTCOME ? 'NOT_REQUIRED' : 'UNCONFIRMED', privateWorkspace = 'PASS', sessionHttpStatus = null
          const diagnostic = { restore: 'NOT_RUN', logout: 'NOT_RUN', probeIdentity: 'NOT_INSPECTED', cleanupFailure: null, diagnosticFields: 'UNAVAILABLE' }
          const diagnosticValues = {
            restore: ['NOT_RUN', 'ATTEMPTED', 'RESTORED', 'NOT_RESTORED', 'FAIL'],
            logout: ['NOT_RUN', 'ATTEMPTED', 'PASS', 'FAIL'],
            probeIdentity: ['NOT_INSPECTED', 'PRESENT', 'ABSENT', 'UNAVAILABLE'],
            cleanupFailure: [null, 'SAVED_SESSION', 'BROWSER_START', 'RESTORE', 'LOGOUT', 'CONTEXT_CLOSE', 'PROBE', 'BROWSER_CLOSE']
          }
          try {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'))
            if (['PASS', 'UNCONFIRMED'].includes(value.session)) session = value.session
            if (Number.isInteger(value.sessionHttpStatus) && value.sessionHttpStatus >= 100 && value.sessionHttpStatus <= 599) sessionHttpStatus = value.sessionHttpStatus
            if (value.version === 1 && Object.keys(value).length === 7 &&
                ['version', 'session', 'sessionHttpStatus', ...Object.keys(diagnosticValues)].every(key => Object.hasOwn(value, key)) &&
                Object.entries(diagnosticValues).every(([key, allowed]) => allowed.includes(value[key]))) {
              for (const key of Object.keys(diagnosticValues)) diagnostic[key] = value[key]
              diagnostic.diagnosticFields = 'PASS'
            }
          } catch {}
          try {
            for (const target of [process.env.RELEASE_OWNER_SESSION_PATH, path.join(process.env.RUNNER_TEMP, 'add-beer-private-' + process.env.GITHUB_RUN_ID + '.log'), path.join(process.env.RUNNER_TEMP, 'add-beer-redacted-reporter.mjs'), path.join(process.env.RUNNER_TEMP, 'add-beer-provenance.mjs'), path.join(process.env.RUNNER_TEMP, 'add-beer-access-handoff.mjs'), ...['key', 'url'].map(kind => path.join(process.env.RUNNER_TEMP, 'add-beer-access-' + kind + '-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT + (kind === 'key' ? '.pem' : '.txt'))), ...['state', 'config'].map(kind => path.join(process.env.RUNNER_TEMP, 'add-beer-preview-' + kind + '-' + process.env.GITHUB_RUN_ID + (kind === 'state' ? '.json' : '.mjs'))), ...['preflight', 'postflight'].map(stage => path.join(process.env.RUNNER_TEMP, 'add-beer-provenance-' + stage + '-' + process.env.GITHUB_RUN_ID + '.log')), 'test-results/release-check', 'playwright-report/release-check']) fs.rmSync(target, { recursive: true, force: true })
          } catch { privateWorkspace = 'UNCONFIRMED' }
          for (const kind of ['key', 'url']) {
            const target = path.join(process.env.RUNNER_TEMP, 'add-beer-access-' + kind + '-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT + (kind === 'key' ? '.pem' : '.txt'))
            try { if (fs.existsSync(target)) privateWorkspace = 'UNCONFIRMED' } catch { privateWorkspace = 'UNCONFIRMED' }
          }
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(file, JSON.stringify({ version: 1, session, sessionHttpStatus, privateWorkspace, ...diagnostic }) + '\n', { mode: 0o600 })
          JS
      - name: Qualify only complete bounded evidence
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const directory = process.env.RELEASE_EVIDENCE_DIRECTORY
          const read = file => { try { return JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8')) } catch { return null } }
          const pre = read('preflight.json'), post = read('postflight.json'), selection = read('selection.json'), cleanup = read('session-cleanup.json'), report = read('release-summary.json')
          const provenance = value => value?.status === 'PASS' && value.access === 'PASS' && value.releaseSha === process.env.RELEASE_SHA && value.health === 'PASS' && value.readiness === 'PASS' && value.healthHttpStatus === 200 && value.readinessHttpStatus === 200
          const oneCase = report?.status === 'PASS' && report.runnerStatus === 'passed' && report.releaseSha === process.env.RELEASE_SHA && report.candidateSha === process.env.GITHUB_SHA && JSON.stringify(report.counts) === JSON.stringify({ expected: 1, passed: 1, failed: 0, skipped: 0, notRun: 0 }) && report.invalidEvents === 0 && report.invalidDiagnostics === 0 && report.runnerErrors === 0 && Array.isArray(report.blockers) && report.blockers.length === 0 && JSON.stringify(report.tests) === JSON.stringify([{ caseId: 'catalogue-readonly.spec.js:65', status: 'PASS' }])
          const pass = process.env.HANDOFF_OUTCOME === 'success' && provenance(pre) && provenance(post) && selection?.status === 'PASS' && selection.selected === 1 && oneCase && cleanup?.session === 'PASS' && cleanup.sessionHttpStatus === 401 && cleanup.privateWorkspace === 'PASS' && cleanup.diagnosticFields === 'PASS'
          const ran = process.env.BROWSER_OUTCOME && process.env.BROWSER_OUTCOME !== 'skipped'
          const summary = { version: 1, qualification: 'READ_ONLY_ADD_BEER_CATEGORIES', sourceSha: process.env.RELEASE_SHA, workerSha: process.env.GITHUB_SHA, diagnosticReporterSha256: '9ad70e1eb4dd0a58c400582a3c6ff99cd45c01f065d2315170f36e6f458d0c05', caseId: 'catalogue-readonly.spec.js:65', connected: ran ? (oneCase ? 'PASS' : 'FAIL') : 'NOT_RUN', status: pass ? 'PASS' : ran ? 'FAIL' : 'BLOCKED' }
          fs.mkdirSync(directory, { recursive: true }); fs.writeFileSync(path.join(directory, 'qualification.json'), JSON.stringify(summary) + '\n', { mode: 0o600 })
          console.log(JSON.stringify(summary)); if (!pass) process.exitCode = 1
          JS
      - name: Retain only redacted bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: add-beer-readonly-97311ddf-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/add-beer-readonly/preflight.json
            artifacts/add-beer-readonly/postflight.json
            artifacts/add-beer-readonly/selection.json
            artifacts/add-beer-readonly/session-cleanup.json
            artifacts/add-beer-readonly/release-summary.json
