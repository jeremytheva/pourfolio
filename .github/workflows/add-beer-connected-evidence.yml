name: Bounded Add Beer read-only evidence
on:
  push:
    branches: [fix/add-beer-connected-evidence-20261027]
permissions:
  contents: read
concurrency:
  group: bounded-current-instance-cellar-certification
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.ref == 'refs/heads/fix/add-beer-connected-evidence-20261027' &&
      contains(github.event.head_commit.message, '[qualify-add-beer-readonly-53299fce]')
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: 53299fce0cfd7a308c36bc0037ac5e2068969131
      RELEASE_BASE_URL: https://pourfolio-oucjlr3cq-jeremythevas-projects.vercel.app
      RELEASE_EVIDENCE_DIRECTORY: artifacts/add-beer-readonly
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 53299fce0cfd7a308c36bc0037ac5e2068969131
          persist-credentials: false
      - name: Verify reviewed source
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare bounded provenance verifier
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/add-beer-provenance.mjs" <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          const { request } = createRequire(path.resolve('package.json'))('@playwright/test')
          const { parseReleaseBaseUrl, verifyReleaseTarget } = await import(pathToFileURL(path.resolve('release-check/releaseTarget.js')))
          const stage = process.argv[2]
          if (!['preflight', 'postflight'].includes(stage)) process.exit(2)
          const statePath = path.join(process.env.RUNNER_TEMP, 'add-beer-preview-state-' + process.env.GITHUB_RUN_ID + '.json')
          const configPath = path.join(process.env.RUNNER_TEMP, 'add-beer-preview-config-' + process.env.GITHUB_RUN_ID + '.mjs')
          const report = { version: 1, stage, releaseSha: process.env.RELEASE_SHA, access: 'NOT_RUN', health: 'NOT_RUN', readiness: 'NOT_RUN', healthHttpStatus: null, readinessHttpStatus: null, blocker: null, status: 'BLOCKED' }
          const exactUrl = (value, origin) => {
            const url = new URL(value)
            if (url.origin !== origin || url.protocol !== 'https:' || url.username || url.password || url.hash) throw new Error('scope')
            return url
          }
          const configurationCodes = new Set(['SHARE_URL_MISSING', 'SHARE_URL_INVALID', 'SHARE_URL_ORIGIN_MISMATCH', 'SHARE_URL_SHAPE_INVALID'])
          const shareUrl = (value, origin) => {
            if (typeof value !== 'string' || !value) throw new Error('SHARE_URL_MISSING')
            if (value.length > 4096) throw new Error('SHARE_URL_INVALID')
            let url
            try { url = new URL(value) } catch { throw new Error('SHARE_URL_INVALID') }
            if (url.origin !== origin || url.protocol !== 'https:' || url.username || url.password || url.hash) throw new Error('SHARE_URL_ORIGIN_MISMATCH')
            const keys = [...url.searchParams.keys()]
            if (url.pathname !== '/' || keys.length !== 1 || keys[0] !== '_vercel_share' || !url.searchParams.get('_vercel_share')) throw new Error('SHARE_URL_SHAPE_INVALID')
            return url
          }
          const scopedState = (state, origin) => {
            const host = new URL(origin).hostname
            if (!state || !Array.isArray(state.origins) || state.origins.length || !Array.isArray(state.cookies) || !state.cookies.length ||
                state.cookies.some(cookie => !cookie || typeof cookie.domain !== 'string' || cookie.domain.replace(/^\./, '') !== host ||
                  typeof cookie.name !== 'string' || !cookie.name || typeof cookie.value !== 'string' || !cookie.value)) throw new Error('state')
            return { cookies: state.cookies, origins: [] }
          }
          let context
          try {
            const origin = parseReleaseBaseUrl(process.env.RELEASE_BASE_URL)
            let state
            if (stage === 'postflight') {
              const stat = fs.lstatSync(statePath)
              if (!stat.isFile() || stat.isSymbolicLink() || (stat.mode & 0o077) !== 0) throw new Error('state')
              state = scopedState(JSON.parse(fs.readFileSync(statePath, 'utf8')), origin)
            }
            context = await request.newContext({ ...(state ? { storageState: state } : {}) })
            const get = async value => {
              const url = exactUrl(value, origin)
              return context.get(url.href, { maxRedirects: 0, maxRetries: 0, timeout: 15000 })
            }
            if (stage === 'preflight') {
              let current = shareUrl(process.env.RELEASE_PREVIEW_SHARE_URL, origin), complete = false
              for (let hop = 0; hop < 5; hop += 1) {
                const response = await get(current.href)
                if ([301, 302, 303, 307, 308].includes(response.status())) {
                  const location = response.headers().location
                  if (!location || hop === 4) throw new Error('redirect')
                  current = exactUrl(new URL(location, current).href, origin)
                } else {
                  if (response.status() !== 200) throw new Error('access')
                  complete = true; break
                }
              }
              if (!complete) throw new Error('access')
              state = scopedState(await context.storageState(), origin)
            }
            report.access = 'PASS'
            const health = await get(origin + '/api/health')
            report.healthHttpStatus = health.status()
            if (health.status() !== 200) throw new Error('unverified')
            const body = await health.json()
            if (body.status !== 'ok' || body.service !== 'pourfolio' || body.release?.commitSha !== report.releaseSha || body.release?.environment !== 'preview') throw new Error('unverified')
            report.health = 'PASS'
            const verified = await verifyReleaseTarget({ baseUrl: origin, releaseSha: report.releaseSha, fetchImpl: async url => {
              const response = await get(url)
              report.readinessHttpStatus = response.status()
              return { status: response.status(), json: () => response.json() }
            } })
            if (verified.environment !== 'preview' || verified.dataProvider !== 'ok') throw new Error('unverified')
            report.readiness = 'PASS'
            if (stage === 'preflight') {
              state = scopedState(await context.storageState(), origin)
              fs.writeFileSync(statePath, JSON.stringify(state), { mode: 0o600, flag: 'wx' })
              const sourceConfig = pathToFileURL(path.resolve('playwright.release.config.js')).href
              const override = { testDir: path.resolve('release-check'), outputDir: path.resolve('test-results/release-check'),
                reporter: [[path.resolve('release-check/redactedReleaseReporter.js')]] }
              const code = 'import base from ' + JSON.stringify(sourceConfig) + ';\nexport default { ...base, ...' + JSON.stringify(override) +
                ', use: { ...base.use, trace: "off", screenshot: "off", video: "off", storageState: ' + JSON.stringify(statePath) + ' } };\n'
              fs.writeFileSync(configPath, code, { mode: 0o600, flag: 'wx' })
            }
            report.status = 'PASS'
          } catch (error) { report.status = 'BLOCKED'; report.blocker = configurationCodes.has(error?.message) ? error.message : 'PROTECTED_PREVIEW_UNVERIFIED' }
          try { await context?.dispose() } catch { report.status = 'BLOCKED'; report.blocker = 'PRIVATE_CONTEXT_CLEANUP_UNCONFIRMED' }
          fs.mkdirSync(process.env.RELEASE_EVIDENCE_DIRECTORY, { recursive: true })
          fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, stage + '.json'), JSON.stringify(report) + '\n', { mode: 0o600 })
          if (report.status !== 'PASS') process.exitCode = 1
          JS
      - name: Verify exact preview before credentials
        id: preflight
        env:
          RELEASE_PREVIEW_SHARE_URL: ${{ secrets.RELEASE_PREVIEW_SHARE_URL }}
        shell: bash
        run: |
          umask 077
          provenance_exit_code=0
          node "$RUNNER_TEMP/add-beer-provenance.mjs" preflight > "$RUNNER_TEMP/add-beer-provenance-preflight-$GITHUB_RUN_ID.log" 2>&1 || provenance_exit_code=$?
          if test -f "$RELEASE_EVIDENCE_DIRECTORY/preflight.json"
          then
            cat "$RELEASE_EVIDENCE_DIRECTORY/preflight.json"
          else
            printf '%s\n' '{"status":"BLOCKED","stage":"preflight","code":"PROVENANCE_REPORT_UNAVAILABLE"}'
            provenance_exit_code=1
          fi
          exit "$provenance_exit_code"
      - name: Prove exactly one reviewed case is selected
        id: selection
        env:
          RELEASE_OWNER_EMAIL: source-selection@example.invalid
          RELEASE_OWNER_PASSWORD: source-selection-only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import { spawnSync } from 'node:child_process'
          const args = ['node_modules/@playwright/test/cli.js', 'test', 'release-check/catalogue-readonly.spec.js', '--config=playwright.release.config.js', '--grep', 'connected Add Beer style choices use every authenticated canonical category page$', '--retries=0', '--workers=1', '--project=connected-chromium', '--list', '--reporter=json']
          const report = { version: 1, status: 'BLOCKED', caseId: 'catalogue-readonly.spec.js:65', selected: 0 }
          try {
            const child = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 30000, maxBuffer: 2 * 1024 * 1024 })
            if (child.error || child.status !== 0) throw new Error('selection')
            const collect = suite => [...(suite.specs || []), ...(suite.suites || []).flatMap(collect)]
            const specs = (JSON.parse(child.stdout).suites || []).flatMap(collect)
            const file = typeof specs[0]?.file === 'string' ? specs[0].file.replaceAll('\\', '/') : ''
            const canonicalFile = file === 'catalogue-readonly.spec.js' || path.resolve(file) === path.resolve('release-check/catalogue-readonly.spec.js')
            if (specs.length !== 1 || specs[0].title !== 'connected Add Beer style choices use every authenticated canonical category page' || specs[0].line !== 65 || !canonicalFile || specs[0].tests.length !== 1 || specs[0].tests[0].projectName !== 'connected-chromium') throw new Error('selection')
            report.selected = 1; report.status = 'PASS'
          } catch {}
          fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, 'selection.json'), JSON.stringify(report) + '\n', { mode: 0o600 })
          if (report.status !== 'PASS') process.exitCode = 1
          JS
      - name: Run one read-only case and close its session
        id: browser
        if: success() && steps.preflight.outcome == 'success' && steps.selection.outcome == 'success'
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/add-beer-owner-${{ github.run_id }}.json
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
        shell: bash
        run: |
          umask 077
          node --input-type=module > "$RUNNER_TEMP/add-beer-private-$GITHUB_RUN_ID.log" 2>&1 <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import { spawnSync } from 'node:child_process'
          let browser, exitCode = 1, cleanup = 'UNCONFIRMED', cleanupHttpStatus = null
          try {
            const args = ['node_modules/@playwright/test/cli.js', 'test', 'release-check/catalogue-readonly.spec.js', '--config=' + path.join(process.env.RUNNER_TEMP, 'add-beer-preview-config-' + process.env.GITHUB_RUN_ID + '.mjs'), '--grep', 'connected Add Beer style choices use every authenticated canonical category page$', '--retries=0', '--workers=1', '--project=connected-chromium', '--reporter=' + path.resolve('release-check/redactedReleaseReporter.js')]
            const child = spawnSync(process.execPath, args, { stdio: 'inherit', timeout: 180000 })
            exitCode = child.error || child.status !== 0 ? 1 : 0
          } catch {} finally {
            try {
              const file = process.env.RELEASE_OWNER_SESSION_PATH, stat = fs.lstatSync(file)
              if (!stat.isFile() || stat.isSymbolicLink() || (stat.mode & 0o077) !== 0) throw new Error('session')
              const saved = JSON.parse(fs.readFileSync(file, 'utf8')), origin = new URL(process.env.RELEASE_BASE_URL).origin
              const owner = crypto.createHash('sha256').update(process.env.RELEASE_OWNER_EMAIL.trim().toLowerCase()).digest('hex')
              if (saved.sha !== process.env.RELEASE_SHA || saved.origin !== origin || saved.owner !== owner || !Array.isArray(saved.cookies) || !saved.cookies.length || saved.cookies.some(cookie => !cookie || typeof cookie.domain !== 'string' || cookie.domain.replace(/^\./, '') !== new URL(origin).hostname || typeof cookie.name !== 'string' || !cookie.name || typeof cookie.value !== 'string' || !cookie.value)) throw new Error('session')
              const { chromium } = await import('@playwright/test')
              const { restoreReleaseOwnerSession } = await import('./release-check/ownerSession.js')
              const { signOut } = await import('./release-check/support.js')
              browser = await chromium.launch()
              const context = await browser.newContext({ baseURL: origin }), page = await context.newPage()
              if (await restoreReleaseOwnerSession(page, process.env.RELEASE_OWNER_EMAIL)) await signOut(page)
              await context.close()
              const probe = await browser.newContext({ baseURL: origin })
              await probe.addCookies(saved.cookies)
              const response = await probe.request.get('/api/nocodebackend/auth/get-session', { maxRedirects: 0, maxRetries: 0 })
              cleanupHttpStatus = response.status()
              cleanup = cleanupHttpStatus === 401 ? 'PASS' : 'UNCONFIRMED'
              await probe.close()
            } catch { cleanup = 'UNCONFIRMED' }
            try { await browser?.close() } catch { cleanup = 'UNCONFIRMED' }
            fs.writeFileSync(path.join(process.env.RELEASE_EVIDENCE_DIRECTORY, 'session-cleanup.json'), JSON.stringify({ version: 1, session: cleanup, sessionHttpStatus: cleanupHttpStatus }) + '\n', { mode: 0o600 })
          }
          process.exitCode = exitCode || (cleanup === 'PASS' ? 0 : 1)
          JS
      - name: Recheck exact preview after attempted browser case
        if: always() && steps.preflight.outcome == 'success' && steps.browser.outcome != 'skipped'
        shell: bash
        run: |
          umask 077
          provenance_exit_code=0
          node "$RUNNER_TEMP/add-beer-provenance.mjs" postflight > "$RUNNER_TEMP/add-beer-provenance-postflight-$GITHUB_RUN_ID.log" 2>&1 || provenance_exit_code=$?
          if test -f "$RELEASE_EVIDENCE_DIRECTORY/postflight.json"
          then
            cat "$RELEASE_EVIDENCE_DIRECTORY/postflight.json"
          else
            printf '%s\n' '{"status":"BLOCKED","stage":"postflight","code":"PROVENANCE_REPORT_UNAVAILABLE"}'
            provenance_exit_code=1
          fi
          exit "$provenance_exit_code"
      - name: Remove all private evidence before retention
        if: always()
        env:
          RELEASE_OWNER_SESSION_PATH: ${{ runner.temp }}/add-beer-owner-${{ github.run_id }}.json
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const directory = process.env.RELEASE_EVIDENCE_DIRECTORY, file = path.join(directory, 'session-cleanup.json')
          let session = process.env.BROWSER_OUTCOME === 'skipped' || !process.env.BROWSER_OUTCOME ? 'NOT_REQUIRED' : 'UNCONFIRMED', privateWorkspace = 'PASS', sessionHttpStatus = null
          try {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'))
            if (['PASS', 'UNCONFIRMED'].includes(value.session)) session = value.session
            if (Number.isInteger(value.sessionHttpStatus) && value.sessionHttpStatus >= 100 && value.sessionHttpStatus <= 599) sessionHttpStatus = value.sessionHttpStatus
          } catch {}
          try {
            for (const target of [process.env.RELEASE_OWNER_SESSION_PATH, path.join(process.env.RUNNER_TEMP, 'add-beer-private-' + process.env.GITHUB_RUN_ID + '.log'), path.join(process.env.RUNNER_TEMP, 'add-beer-provenance.mjs'), ...['state', 'config'].map(kind => path.join(process.env.RUNNER_TEMP, 'add-beer-preview-' + kind + '-' + process.env.GITHUB_RUN_ID + (kind === 'state' ? '.json' : '.mjs'))), ...['preflight', 'postflight'].map(stage => path.join(process.env.RUNNER_TEMP, 'add-beer-provenance-' + stage + '-' + process.env.GITHUB_RUN_ID + '.log')), 'test-results/release-check', 'playwright-report/release-check']) fs.rmSync(target, { recursive: true, force: true })
          } catch { privateWorkspace = 'UNCONFIRMED' }
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(file, JSON.stringify({ version: 1, session, sessionHttpStatus, privateWorkspace }) + '\n', { mode: 0o600 })
          JS
      - name: Qualify only complete bounded evidence
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const directory = process.env.RELEASE_EVIDENCE_DIRECTORY
          const read = file => { try { return JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8')) } catch { return null } }
          const pre = read('preflight.json'), post = read('postflight.json'), selection = read('selection.json'), cleanup = read('session-cleanup.json'), report = read('release-summary.json')
          const provenance = value => value?.status === 'PASS' && value.access === 'PASS' && value.releaseSha === process.env.RELEASE_SHA && value.health === 'PASS' && value.readiness === 'PASS' && value.healthHttpStatus === 200 && value.readinessHttpStatus === 200
          const oneCase = report?.status === 'PASS' && report.runnerStatus === 'passed' && report.releaseSha === process.env.RELEASE_SHA && report.candidateSha === process.env.GITHUB_SHA && JSON.stringify(report.counts) === JSON.stringify({ expected: 1, passed: 1, failed: 0, skipped: 0, notRun: 0 }) && report.invalidEvents === 0 && report.runnerErrors === 0 && Array.isArray(report.blockers) && report.blockers.length === 0 && JSON.stringify(report.tests) === JSON.stringify([{ caseId: 'catalogue-readonly.spec.js:65', status: 'PASS' }])
          const pass = provenance(pre) && provenance(post) && selection?.status === 'PASS' && selection.selected === 1 && oneCase && cleanup?.session === 'PASS' && cleanup.sessionHttpStatus === 401 && cleanup.privateWorkspace === 'PASS'
          const ran = process.env.BROWSER_OUTCOME && process.env.BROWSER_OUTCOME !== 'skipped'
          const summary = { version: 1, qualification: 'READ_ONLY_ADD_BEER_CATEGORIES', sourceSha: process.env.RELEASE_SHA, workerSha: process.env.GITHUB_SHA, caseId: 'catalogue-readonly.spec.js:65', connected: ran ? (oneCase ? 'PASS' : 'FAIL') : 'NOT_RUN', status: pass ? 'PASS' : ran ? 'FAIL' : 'BLOCKED' }
          fs.mkdirSync(directory, { recursive: true }); fs.writeFileSync(path.join(directory, 'qualification.json'), JSON.stringify(summary) + '\n', { mode: 0o600 })
          console.log(JSON.stringify(summary)); if (!pass) process.exitCode = 1
          JS
      - name: Retain only redacted bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: add-beer-readonly-53299fce-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/add-beer-readonly/preflight.json
            artifacts/add-beer-readonly/postflight.json
            artifacts/add-beer-readonly/selection.json
            artifacts/add-beer-readonly/session-cleanup.json
            artifacts/add-beer-readonly/release-summary.json
            artifacts/add-beer-readonly/qualification.json
