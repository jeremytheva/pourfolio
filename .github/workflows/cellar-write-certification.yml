name: Protected two-account authentication verification
on:
  push:
    branches:
      - agent/144-auth-only-20261026
permissions:
  contents: read
concurrency:
  group: protected-two-account-auth-verification
  cancel-in-progress: false
jobs:
  verify-auth:
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify sign-in, matching session and sign-out only
        env:
          BONUS_CERTIFICATION_BASE_URL: https://brew-buds-mobile-app-design-3577.vercel.app
          BONUS_CERTIFICATION_AUTH_SHA: f13e07a845714ea02d744394dbe1684e614c8bfb
          RELEASE_OWNER_EMAIL: ${{ secrets.RELEASE_OWNER_EMAIL }}
          RELEASE_OWNER_PASSWORD: ${{ secrets.RELEASE_OWNER_PASSWORD }}
          RELEASE_OTHER_EMAIL: ${{ secrets.RELEASE_OTHER_EMAIL }}
          RELEASE_OTHER_PASSWORD: ${{ secrets.RELEASE_OTHER_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { resolveBonusCertificationOwner } from './scripts/bonus-certification-owner.js'
          const report = { qualification: 'AUTH_ONLY', releaseSha: process.env.BONUS_CERTIFICATION_AUTH_SHA,
            startedAt: new Date().toISOString(), dataWrites: 0, accounts: [] }
          let primaryId
          for (const account of ['owner', 'other']) {
            const environment = { ...process.env }
            delete environment.NOCODEBACKEND_CONTRACT_USER_ID
            if (account === 'other') {
              environment.RELEASE_OWNER_EMAIL = environment.RELEASE_OTHER_EMAIL
              environment.RELEASE_OWNER_PASSWORD = environment.RELEASE_OTHER_PASSWORD
            }
            try {
              const result = await resolveBonusCertificationOwner({ environment })
              if (account === 'owner') primaryId = result.id
              else if (result.id === primaryId) {
                report.accounts.push({ account, status: 'BLOCKED', error: 'ACCOUNTS_NOT_DISTINCT' })
                break
              }
              report.accounts.push({ account, status: 'PASS', signInSessionSignOut: 'PASS' })
            } catch (error) {
              const allowed = new Set(['BONUS_TEST_OWNER_AUTH_REJECTED', 'BONUS_TEST_OWNER_SESSION_UNCONFIRMED',
                'BONUS_TEST_OWNER_AUTH_UNAVAILABLE', 'BONUS_TEST_OWNER_SIGNOUT_UNCONFIRMED',
                'BONUS_TEST_OWNER_TARGET_UNVERIFIED', 'RUNTIME_CONFIGURATION_MISSING'])
              report.accounts.push({ account, status: 'BLOCKED',
                error: allowed.has(error.code) ? error.code : 'AUTH_VERIFICATION_UNAVAILABLE',
                ...(['sign-in', 'get-session', 'sign-out'].includes(error.authStage) ? { stage: error.authStage } : {}),
                ...(Number.isInteger(error.authStatus) ? { httpStatus: error.authStatus } : {}),
                ...(error.sessionCleanup === 'UNCONFIRMED' ? { sessionCleanup: 'UNCONFIRMED' } : {}) })
              break
            }
          }
          report.completedAt = new Date().toISOString()
          report.status = report.accounts.length === 2 && report.accounts.every(row => row.status === 'PASS') ? 'PASS' : 'BLOCKED'
          console.log(JSON.stringify(report))
          process.exitCode = report.status === 'PASS' ? 0 : 2
          JS
